<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Frota">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Controle de Frota</title>
<meta name="theme-color" content="#0b2470">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: celular primeiro — cabecalho fino no topo, cartoes empilhados, barra de navegacao no polegar, formularios em gaveta de tela cheia */
:root{
  --bg:#edf0f5; --surface:#ffffff; --sunk:#f3f5f9; --line:#dfe4ec; --line-2:#c9d1de;
  --fg:#121a2c; --muted:#4f5a70; --faint:#677289;
  --ink:#0b2470; --ink-fg:#ffffff; --ink-muted:#a9b8e6; --ink-acc:#9cbcff; --brand-red:#e30613;
  --accent:#0033a0; --accent-tx:#0033a0; --accent-ink:#ffffff; --accent-soft:#e2e9f8;
  --st-bg:#e9eef6; --st-fg:#24427a; --ok:#1b6638; --ok-bg:#e2f1e7; --warn:#8a4b00; --warn-bg:#fbeed6; --bad:#a3271c; --bad-bg:#f8e1dd;
  --shadow:0 1px 2px rgba(11,36,112,.06),0 4px 14px rgba(11,36,112,.06);
  --sit-ok:#1d7440; --sit-warn:#b85a06; --sit-bad:#b02b20;
  --c1:#0033a0; --c2:#2f7d6b; --c3:#d99a1e; --c4:#9a6b9e; --c5:#b5a27a; --c0:#cfd4ce;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --navh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f1a; --surface:#141a28; --sunk:#0f1422; --line:#232b3d; --line-2:#30394d;
  --fg:#e6eaf3; --muted:#a2abbe; --faint:#858fa4;
  --ink:#0e2263; --ink-fg:#f0f4fd; --ink-muted:#93a4d6; --ink-acc:#9cbcff; --brand-red:#ff2b36;
  --accent:#3566e0; --accent-tx:#9cbcff; --accent-ink:#ffffff; --accent-soft:#18265a;
  --st-bg:#18202b; --st-fg:#9db8ea; --ok:#5cc184; --ok-bg:#16291e; --warn:#f0a83a; --warn-bg:#33260f; --bad:#f07565; --bad-bg:#371c18;
  --shadow:0 1px 2px rgba(0,0,0,.3); --c1:#5b86f0; --c2:#4fb39b; --c3:#e0a83a; --c4:#c193c5; --c5:#a8977a; --c0:#36403a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f1a; --surface:#141a28; --sunk:#0f1422; --line:#232b3d; --line-2:#30394d;
  --fg:#e6eaf3; --muted:#a2abbe; --faint:#858fa4;
  --ink:#0e2263; --ink-fg:#f0f4fd; --ink-muted:#93a4d6; --ink-acc:#9cbcff; --brand-red:#ff2b36;
  --accent:#3566e0; --accent-tx:#9cbcff; --accent-ink:#ffffff; --accent-soft:#18265a;
  --st-bg:#18202b; --st-fg:#9db8ea; --ok:#5cc184; --ok-bg:#16291e; --warn:#f0a83a; --warn-bg:#33260f; --bad:#f07565; --bad-bg:#371c18;
  --shadow:0 1px 2px rgba(0,0,0,.3); --c1:#5b86f0; --c2:#4fb39b; --c3:#e0a83a; --c4:#c193c5; --c5:#a8977a; --c0:#36403a; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
/* a rolagem acontece num conteiner proprio, sem barra de rolagem visivel */
html,body{height:100%;overflow:hidden;margin:0}
#scroller{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
#scroller::-webkit-scrollbar{display:none;width:0;height:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* cabecalho */
header{cursor:pointer;-webkit-user-select:none;user-select:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--ink);color:var(--ink-fg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:10px;line-height:1}
.brand i{width:10px;height:20px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--brand-red) 0 4px,#fff 4px 8px)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-muted)}
.sync.on::before{background:#4fd18a;box-shadow:0 0 0 3px rgba(79,209,138,.18)}
.sync.off::before{background:#f07565}

main{display:flex;flex-direction:column;gap:14px;padding-block:14px calc(100px + env(safe-area-inset-bottom,0px))}

/* cartoes */
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px 14px;min-width:0;scroll-margin-top:calc(60px + env(safe-area-inset-top,0px))}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ch h2{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1.05;text-wrap:balance;display:flex;align-items:center;gap:9px}
.ch h2 svg{width:22px;height:22px;color:var(--accent);flex:0 0 auto}
.ch .sub{font-size:13px;color:var(--muted);margin-top:3px}
.lbl{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl:first-child{margin-top:0}
.lbl .c{font-family:var(--mono);letter-spacing:0}

/* botoes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;font-weight:600;font-size:15px;border-radius:12px;padding:0 16px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.out{background:var(--surface);border:1.5px solid var(--accent);color:var(--accent-tx)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.btn.ghost{border-color:transparent;background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:transparent;background:var(--bad-bg)}
.btn.sm{min-height:36px;font-size:14px;padding:0 12px;border-radius:10px}
.btn.icon{width:40px;min-height:40px;padding:0;border-radius:12px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* indicadores */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--sunk);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted);line-height:1.3}
.kpi.bad{background:var(--bad-bg)} .kpi.bad b{color:var(--bad)}
.kpi.warn{background:var(--warn-bg)} .kpi.warn b{color:var(--warn)}

/* listas */
.list{display:flex;flex-direction:column;background:var(--sunk);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 13px;min-height:60px;width:100%;text-align:left;background:none;border:0;cursor:pointer;position:relative}
.row+.row{box-shadow:inset 0 1px 0 var(--line)}
button.row:active{background:var(--line)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.row .end{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.chev{width:16px;height:16px;color:var(--faint);flex:0 0 auto}
.stripe{position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0}
.stripe.bad{background:var(--bad)} .stripe.warn{background:var(--warn)}
.code{font-family:var(--mono);font-weight:600;font-size:12.5px;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;white-space:nowrap;letter-spacing:.01em}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.mut{background:var(--surface);color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hm{display:inline-flex;align-items:baseline;gap:3px;font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;background:var(--ink);color:var(--ink-fg);border-radius:7px;padding:3px 8px;letter-spacing:.03em;white-space:nowrap;font-size:14px}
.hm small{color:var(--ink-acc);font-size:10px}
.hm.lg{font-size:24px;padding:6px 12px;border-radius:10px}
.hm.lg small{font-size:12px}
.qty{font-family:var(--mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.qty small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-left:3px}
.more{display:flex;justify-content:center;padding-top:10px}

/* filtros */
.search{position:relative;margin-bottom:8px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
.search input{padding-left:38px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 12px;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
/* sem indicador de rolagem em nenhuma area do app */
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0;background:transparent}
.chip{flex:0 0 auto;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}

/* campos */
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px;width:100%;min-width:0;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date]{padding-block:10px}
textarea{padding:11px 12px;min-height:80px;resize:vertical}
textarea.ag{min-height:46px;resize:none;overflow:hidden;line-height:1.35}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.f:has(>.hint){display:grid;grid-template-columns:auto 1fr;column-gap:6px;align-items:baseline}
.f:has(>.hint)>:not(.hint){grid-column:1/-1}
.f .hint{font-weight:400;font-size:12px;color:var(--faint)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid>.w{grid-column:1/-1}
.fset{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.fset+.fset{margin-top:12px}
.fset>h3{margin:0;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;border:0;border-radius:9px;background:none;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* vazio */
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--sunk);border-radius:14px}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:3px}
.hero{background:var(--ink);color:var(--ink-fg);border-radius:16px;padding:22px 18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,transparent 8px 16px);opacity:.18;border-radius:50%}
.hero h3{font-family:var(--display);font-size:26px;text-transform:uppercase;margin:0 0 8px;line-height:1.05;position:relative}
.hero p{margin:0 0 16px;color:var(--ink-muted);font-size:14.5px;max-width:46ch;position:relative}
.hero .acts{display:flex;flex-direction:column;gap:8px;position:relative}
.hero .btn.ghost{background:rgba(255,255,255,.08);color:var(--ink-fg)}

/* barra de exemplos */
.banner{background:var(--accent-soft);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:13.5px}
.banner b{display:block;font-size:14px}

/* medidor */
.meter{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}

/* situacao */
.sit{display:inline-block;min-width:92px;text-align:center;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.sit.mut{background:var(--sunk);color:var(--muted)} .sit.ok{background:var(--sit-ok)} .sit.warn{background:var(--sit-warn)} .sit.bad{background:var(--sit-bad)}
.ti-g{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px 6px}
.ti-more{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 14px;background:none;border:0;border-top:1px solid var(--line);color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.ti-more svg{width:16px;height:16px;transition:transform .2s}.ti-more[aria-expanded=true] svg{transform:rotate(90deg)}
.ti-ok>.chk:first-child{box-shadow:inset 0 1px 0 var(--line)}
.sit-m{font-size:12px;color:var(--muted);font-weight:400;margin-top:6px;line-height:1.4}

/* leitura rapida */
body.focus .sidetabs{display:none!important}
.sidetabs{position:fixed;z-index:8;right:0;top:calc(22% + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:22px;padding-right:env(safe-area-inset-right,0px)}
.stab{display:flex;flex-direction:column;align-items:center;gap:9px;width:26px;padding:12px 0;border-radius:12px 0 0 12px;cursor:pointer;font:inherit}
.stab .sl{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:13.5px;letter-spacing:.03em;line-height:1}
.stab.dark{background:var(--ink);color:var(--ink-fg);border:0;box-shadow:-3px 4px 12px rgba(10,21,16,.22);padding:12px 0 10px}
.stab.dark .sa{width:14px;height:14px;color:var(--ink-fg)}
.stab.lite{background:var(--surface);color:var(--muted);border:1px solid var(--line-2);border-right:0;box-shadow:-2px 3px 10px rgba(10,21,16,.08)}
.stab.lite .dot{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
/* modo ajuste ligado: amarelo bem visivel, igual nos dois temas */
.stab.lite.on{background:#ffc21a;border-color:#e0a400;color:#2b1c00;box-shadow:-3px 4px 14px rgba(255,194,26,.45)}
.stab.lite.on .dot{background:#2b1c00;box-shadow:0 0 0 3px rgba(43,28,0,.2)}
.aj-b{margin-bottom:12px;border:1.5px solid #e0a400;background:#fff4cc;color:#2b1c00}
.aj-b b{color:#2b1c00}
.aj-b .btn{flex:none;background:#2b1c00;border-color:#2b1c00;color:#ffc21a}
.toast.aj{background:#ffc21a;color:#2b1c00;border:1px solid #e0a400;box-shadow:0 6px 20px rgba(255,194,26,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .aj-b{background:#3a2e08;color:#ffe9a8}:root:not([data-theme=light]) .aj-b b{color:#ffd24d}}
:root[data-theme=dark] .aj-b{background:#3a2e08;color:#ffe9a8}:root[data-theme=dark] .aj-b b{color:#ffd24d}
.stab .sh-n{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:2px 3px;line-height:1.2;writing-mode:vertical-rl;transform:rotate(180deg)}
.stab .sh-n{background:#fff;color:var(--ink)}.stab .sh-n.zero{background:#c62828;color:#fff}.stab .sh-n.all{background:#1b7a3a;color:#fff}
.stab:active{transform:scale(.96)}
.quick{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 14px;border-radius:18px;border:0;background:var(--ink);color:var(--ink-fg);cursor:pointer;text-align:left;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.quick .qi{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:0 0 auto}
.quick .qi svg{width:24px;height:24px;color:var(--ink-acc)}
.quick .qt{flex:1;min-width:0}
.quick .qt b{display:block;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.quick .qt span{font-size:13px;color:var(--ink-muted)}
.quick .chev{color:var(--ink-muted)}
.quick .qbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08)}
.quick .qbar i{display:block;height:100%;background:var(--accent)}
.quick:active{transform:scale(.99)}
.lr-top{margin-bottom:10px}
.lr-dt{max-width:220px}
.lr-chips{margin:0 -14px 10px;padding:0 14px}
.lr-chips .chip em{font-style:normal;font-family:var(--mono);font-size:12px;opacity:.75;margin-left:3px}
.lr-list{display:flex;flex-direction:column;gap:6px}
.lr-t{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 2px 2px}
.lr-t:first-child{margin-top:0}
.lr{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 13px;border-radius:14px;background:var(--surface);border:1.5px solid transparent;position:relative;overflow:hidden}
.lr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}.lr-g::before{background:#12c45a}.lr-y::before{background:#ffb800}.lr-r::before{background:#d6002e}
.lr.fill{border-color:var(--ok)}
.lr.low{border-color:var(--warn)}
.lr-i{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lr-c{font-family:var(--mono);font-weight:600;font-size:16px}
.lr-p{font-size:12.5px;color:var(--muted)}
.lr-p b{font-family:var(--mono);color:var(--fg);font-weight:600}
.lr-w{font-size:12px;color:var(--warn);font-weight:600}
.lr-w:empty{display:none}
.lr-x{display:block;margin-top:4px;padding:0;border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--accent-tx,var(--accent));text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
#thm-w:empty{display:none}

/* ---------- combustivel ---------- */
.cb-card{background:var(--ink);color:var(--ink-fg);border-radius:16px;padding:14px 16px 6px}
.cb-mh{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);padding-bottom:6px}

.es-b.bad{background:var(--bad-bg);color:var(--bad)} .es-b.warn{background:var(--warn-bg);color:var(--warn)} .es-b.ok{background:var(--ok-bg);color:var(--ok)}
.es-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}

/* motorista discreto sob a descricao (a descricao continua centralizada na linha) */
.tq.wm,body.focus .tq.wm{min-height:56px}.tq.wm .tq-m{display:flex;flex-direction:column;justify-content:center;gap:2px}.tq-mt{display:block;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.al-b{display:flex;flex-direction:column;gap:8px}
.al-o{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:0 14px;border:0;border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:var(--fg);box-shadow:var(--shadow)}
.al-o span{font-size:14px;font-weight:600;min-width:84px}.al-o b{flex:1;min-width:0;text-align:right;font-weight:500;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.al-o b.al-v0{color:var(--accent-tx,var(--accent));font-weight:600}
.ral-seg{grid-template-columns:repeat(auto-fit,minmax(80px,1fr))}.ral-seg.fr{grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}.ral-seg button{white-space:nowrap;padding:0 10px;font-size:14.5px}
.tq{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 13px;background:none;border:0;cursor:pointer;text-align:left;width:100%}
.tq+.tq{box-shadow:inset 0 1px 0 var(--line)}
.tq:active{background:var(--line)}
.tq-c{font-family:var(--mono);font-weight:600;font-size:15px;min-width:62px;letter-spacing:.02em}

.tq-x span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tq-n{font-family:var(--mono);font-weight:600;font-size:13px;background:var(--surface);border-radius:999px;padding:2px 9px}
.finder{position:relative;margin-bottom:4px}

.lr-t:first-child{margin-top:2px}
.tq-m{flex:1;min-width:0;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* alocacao */
.aloc{display:flex;flex-direction:column;gap:18px;padding-top:14px}
.dist{display:flex;flex-direction:column;gap:10px}
.dist-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:13px 13px 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-width:0;overflow:hidden;transition:border-color .15s,background .15s}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.tile .tl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.sel{border-radius:18px;background:var(--sunk);padding:14px 12px 6px}

.sel-h .chev{transform:rotate(90deg)}

.fr{padding-block:8px}

.fr-h::after{content:"";flex:1;height:1px;background:var(--line)}
.eqr{display:flex;align-items:center;gap:11px;width:100%;min-height:56px;padding:9px 12px;background:var(--surface);border:0;border-radius:12px;cursor:pointer;text-align:left}

.sem{border:1.5px dashed var(--line-2);border-radius:16px}

/* painel */
#sec-painel{padding:0 14px 14px;overflow:hidden}
.ph.pnb{margin:0 -14px 2px;padding:12px 14px;color:#fff}

.pnb-n{font-size:13.5px;font-weight:700;letter-spacing:.01em}

.ph{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ph h2{margin:0;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:8px}

#sec-painel .list{margin-top:12px}

/* cartoes expansiveis */
.acc{padding:0;overflow:hidden}
/* logo fixa no rodape da tela inicial, entre o carrinho e o +; ajusta a largura e a area segura de cada aparelho */
/* na tela inicial a rolagem termina acima da faixa da logo: o conteudo nunca passa por baixo dela */
:root{--brandh:calc(24px + env(safe-area-inset-bottom,0px))}

.brandmark::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:6px;background:linear-gradient(to bottom,transparent,var(--bg))}
.brandmark img{width:min(132px,calc(100vw - 196px));min-width:84px;height:auto;opacity:.72}

.acc-h{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:0 16px;background:none;border:0;cursor:pointer;text-align:left}
.acc-h .ic{width:42px;height:42px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;flex:0 0 auto}
.acc-h .ic svg{width:22px;height:22px;color:var(--accent)}
.acc-h h2{flex:1;margin:0;font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.acc-h .tg{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);flex:0 0 auto;transition:transform .2s ease}
.acc-h .tg svg{width:16px;height:16px;color:var(--muted);transform:rotate(90deg)}
.acc-h[aria-expanded="true"] .tg{transform:rotate(180deg)}
.acc-h:active{background:var(--sunk)}

/* ---------- regras ---------- */
function itemStatus(eq,it){
  const h=Number(eq.horimetro)||0, iv=Number(it.intervalo)||0;
  const ult=it.ultimaH!==''&&it.ultimaH!=null?Number(it.ultimaH):0;
  const manual=it.proxH!==''&&it.proxH!=null&&!isNaN(Number(it.proxH));
  if(!manual&&!iv) return {cls:'mut',label:'Sem intervalo',rest:Infinity,prox:null,pct:0};
  const prox=manual?Number(it.proxH):ult+iv, span=Math.max(1,prox-ult), rest=prox-h, pct=Math.max(0,Math.min(1,(h-ult)/span));
  const uso=Number(eq.usoDiario)||0;
  const prev=rest>0&&uso>0?addDays(rest/uso):(rest<=0?today():null);
  let cls='ok',label=`${nf(rest)} h`;
  if(rest<=0){cls='bad';label=`Vencida ${nf(-rest)} h`}
  else if(rest<=Math.max(50,span*.1)){cls='warn';label=`Faltam ${nf(rest)} h`}
  else label=`Faltam ${nf(rest)} h`;
  return {cls,label,rest,prox,pct,prev,manual};
}
function eqSituacao(e){
  if(!(e.itens||[]).length)return {cls:'mut',label:'Sem plano',mot:[]};
  const crit=[],aten=[];
  (e.itens||[]).forEach(it=>{const st=itemStatus(e,it),sk=it.estoqueId&&stById(it.estoqueId);
    const need=Number(it.qtd)||0,saldo=sk?stQtd(sk):null;
    if(st.cls==='bad')crit.push(`${itNome(it)}: troca vencida`);
    else if(st.cls==='warn')aten.push(`${itNome(it)}: troca proxima`);
    if(sk){
      if((st.cls==='bad'||st.cls==='warn')&&saldo<need)crit.push(`${sk.desc}: estoque insuficiente para a troca`);
      else if(stockCls(sk)!=='ok')aten.push(`${sk.desc}: estoque ${stockCls(sk)==='bad'?'zerado':'abaixo do minimo'}`);
    }});
  if(crit.length)return {cls:'bad',label:'Critico',mot:[...crit,...aten]};
  if(aten.length)return {cls:'warn',label:'Atencao',mot:aten};
  return {cls:'ok',label:'Regular',mot:[]};
}
const _ai={};
function allItems(){
  const d=today();if(_ai.e===S.equips&&_ai.s===S.estoque&&_ai.d===d)return _ai.r;
  const out=[];
  S.equips.forEach(eq=>{if(eq.status==='inativo')return;(eq.itens||[]).forEach(it=>out.push({eq,it,st:itemStatus(eq,it)}))});
  _ai.e=S.equips;_ai.s=S.estoque;_ai.d=d;return _ai.r=out.sort((a,b)=>a.st.rest-b.st.rest);
}
const isKit=s=>!!(s&&s.kit);
/* ---------- equivalencia de filtros entre preventivas ---------- */
const eqvKey=(a,b)=>{const x=nzCod(a),y=nzCod(b);return x<y?x+'|'+y:y+'|'+x};
const eqvDec=(a,b)=>{const k=eqvKey(a,b);const p=S.equiv.find(p=>eqvKey(p.a,p.b)===k);return p?p.status:''};
/* codigos equivalentes a um codigo (decisoes "equivalentes") */
const eqvCods=c=>{const k=nzCod(c);return S.equiv.filter(p=>p.status==='eq'&&(nzCod(p.a)===k||nzCod(p.b)===k)).map(p=>nzCod(p.a)===k?p.b:p.a)};
/* compara, item a item, o codigo usado em cada preventiva com o da anterior do mesmo item */
function eqvPend(eqId){
  const out=[],seen=new Set();
  const ts=S.trocas.filter(t=>t.tipo!=='filtro_ar'&&t.tipo!=='reprog'&&t.tipo!=='hmtroca'&&(!eqId||t.equipId===eqId)).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  const last={};
  ts.forEach(t=>(t.itens||[]).forEach(i=>{if(!i.espec)return;const k=t.equipId+'|'+(i.pid||nzCod(i.desc));const prev=last[k];
    if(prev&&nzCod(prev.espec)!==nzCod(i.espec)&&!eqvDec(prev.espec,i.espec)){const key=t.equipId+eqvKey(prev.espec,i.espec);
      if(!seen.has(key)){seen.add(key);out.push({equipId:t.equipId,desc:i.desc,a:prev.espec,da:prev.data,b:i.espec,db:t.data})}}
    last[k]={espec:i.espec,data:t.data}}));
  return out;
}

  if(!ps.length){openSheet({title:'Equivalencia de filtros',sub:'Nada a confirmar',body:'<div class="empty">Todos os filtros que mudaram de codigo ja foram confirmados.</div>'});return}
  openSheet({title:'Equivalencia de filtros',sub:'Os dois codigos se substituem?',
  body:ps.map((p,i)=>{const e=eqById(p.equipId);return `<div class="eqv" data-i="${i}"><div class="eqv-h"><span class="num">${esc(e?e.codigo:'')}</span><b>${esc(p.desc)}</b></div>

    <div class="eqv-b"><button type="button" class="btn sm pri" data-eq="eq">Equivalentes</button><button type="button" class="btn sm" data-eq="dif">Diferentes</button><button type="button" class="btn sm ghost" data-eq="">Depois</button></div></div>`}).join(''),
  mount:sh=>sh.querySelectorAll('.eqv').forEach(box=>box.querySelectorAll('[data-eq]').forEach(b=>b.onclick=async()=>{const p=ps[+box.dataset.i],st=b.dataset.eq;
    if(!st){box.remove();if(!sh.querySelector('.eqv'))goBack();return}
    const pares=[...S.equiv.filter(x=>eqvKey(x.a,x.b)!==eqvKey(p.a,p.b)),{a:p.a,b:p.b,desc:p.desc,equipId:p.equipId,status:st,data:today()}];
    if(await safe(()=>S.db.doc('config/equivalencias').set({pares}),st==='eq'?'Marcados como equivalentes':'Marcados como diferentes')){box.remove();if(!sh.querySelector('.eqv'))goBack()}}))});
}

const stOfIt=i=>(i&&i.estoqueId&&stById(i.estoqueId))||(i&&i.espec&&typeof findSt==='function'&&(findSt(i.espec)||eqvCods(i.espec).map(findSt).find(Boolean)))||null;
const itNome=i=>{const s=stOfIt(i);return s?s.desc:(i&&i.desc)||''};

/* o que serve num equipamento: itens do plano, pecas com encaixe e kits dele (pelo plano, encaixe ou TAG no codigo/nome do kit) */
function eqCompat(e){const plan=(e.itens||[]).map(stOfIt).filter(Boolean),enc=encaixeDe(e.id),tag=nzCod(e.codigo);
  const kits=S.estoque.filter(x=>isKit(x)&&(plan.some(p=>p.id===x.id)||enc.some(p=>p.id===x.id)||nzCod(x.codigo).includes(tag)||nzCod(x.desc).includes(tag))).sort(byCode);
  const ids=new Set();[...plan,...enc].filter(x=>!isKit(x)).forEach(x=>ids.add(x.id));kits.forEach(k=>kitComps(k).forEach(({s:y})=>ids.add(y.id)));
  return {kits,its:S.estoque.filter(x=>ids.has(x.id)).sort(byCode)}}

function kitDisp(k){const cs=kitComps(k).filter(x=>Number(x.c.qtd)>0);if(!cs.length)return 0;return Math.max(0,Math.min(...cs.map(x=>Math.floor((Number(x.s.qtd)||0)/Number(x.c.qtd)+1e-9))))}

/* =====================================================================
   COMBUSTIVEL — consumo por hora trabalhada (L/h)
   Dados por mes, para o app nunca carregar o historico inteiro:
     comb/{AAAA-MM}             resumo do mes: eq[equipId] = {lt litros abastecidos, n abastecimentos, l litros medidos, h horas medidas}
     comb/{AAAA-MM}/abast/{id}  cada abastecimento
   No equipamento: combBase {h,data,pend} = ultimo tanque cheio (base da medicao) e litros parciais acumulados;
                   combUlt {mes,id} = ultimo abastecimento lancado (so ele pode ser excluido).
   Metodo do tanque cheio: L/h = (litros deste tanque + parciais anteriores) ÷ (horimetro − horimetro do tanque cheio anterior).
   Nada e buscado ate o topico ser aberto; cada mes e buscado so quando escolhido.
   ===================================================================== */
const mesKey=d=>(d||today()).slice(0,7);
const MESES=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesNome=m=>{const[y,mm]=m.split('-');return `${MESES[Number(mm)-1]} ${y}`};
const lhTxt=v=>v==null||!isFinite(v)?'—':nf(v,1)+' L/h';
/* topico: so a lista de equipamentos por alocacao (usa o cadastro ja carregado; nada de combustivel e buscado aqui) */
function vComb(){
  if(S.focus!=='comb')return '';
  const ord=(a,b)=>{const ia=TIPOS.indexOf(a.tipo),ib=TIPOS.indexOf(b.tipo);return (ia<0?99:ia)-(ib<0?99:ib)||byCode(a,b)};

async function abastGravar(e,{dt,h0,h,dl,l,cheio,horas,lh,L,nb,b,resp='',obs=''}){

    antBase:b||null,antUlt:e.combUlt||null,antUltData:e.combUltData||''});
  const md=S.db.doc('comb/'+m),cur=await md.get(),d=(cur.exists&&cur.data())||{eq:{}},x=(d.eq||{})[e.id]||{lt:0,n:0,l:0,h:0};

/* prepara a foto antes de enviar: recorta o fundo branco em volta do objeto,
   centraliza com margem estreita e igual nos 4 lados, sem ampliar e sem mudar a proporcao */
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const M=2400,k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
    const W=Math.round(img.naturalWidth*k),H=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});
    x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(img,0,0,W,H);
    const id=x.getImageData(0,0,W,H),d=id.data;
    // fundo claro (branco, cinza ou degrade de estudio): pinta de branco a partir das bordas
    {let n=0,r=0,g=0,b=0;const bp=[];for(let X=0;X<W;X+=2)bp.push(X,(H-1)*W+X);for(let Y=0;Y<H;Y+=2)bp.push(Y*W,Y*W+W-1);
      bp.forEach(q=>{r+=d[q*4];g+=d[q*4+1];b+=d[q*4+2];n++});r/=n;g/=n;b/=n;
      const far=q=>Math.max(Math.abs(d[q*4]-r),Math.abs(d[q*4+1]-g),Math.abs(d[q*4+2]-b));
      const light=q=>Math.min(d[q*4],d[q*4+1],d[q*4+2])>175&&Math.abs((d[q*4]-d[q*4+2])-(r-b))<16&&Math.abs((d[q*4+1]-d[q*4+2])-(g-b))<16;
      if(Math.min(r,g,b)>185&&bp.filter(q=>light(q)&&far(q)<45).length/bp.length>.8){
        const seen=new Uint8Array(W*H),st=[],band=[];for(let Y=0;Y<H;Y++)for(let X=0;X<W;X++)if(X<4||Y<4||X>=W-4||Y>=H-4)band.push(Y*W+X);band.forEach(q=>{if(light(q)&&far(q)<55){seen[q]=1;st.push(q)}});
        const step=(a,c)=>Math.max(Math.abs(d[a*4]-d[c*4]),Math.abs(d[a*4+1]-d[c*4+1]),Math.abs(d[a*4+2]-d[c*4+2]))<=9;
        const done=[];
        while(st.length){const q=st.pop();done.push(q);const X=q%W;
          for(const nq of [X>0?q-1:-1,X<W-1?q+1:-1,q-W,q+W])if(nq>=0&&nq<W*H&&!seen[nq]&&light(nq)&&far(nq)<55&&step(q,nq)){seen[nq]=1;st.push(nq)}}
        // devolve o que foi apagado por engano dentro do contorno do objeto (linha e coluna)
        const rx0=new Int32Array(H).fill(W),rx1=new Int32Array(H).fill(-1),cy0=new Int32Array(W).fill(H),cy1=new Int32Array(W).fill(-1);
        for(let Y=0;Y<H;Y++)for(let X=0;X<W;X++)if(!seen[Y*W+X]){if(X<rx0[Y])rx0[Y]=X;if(X>rx1[Y])rx1[Y]=X;if(Y<cy0[X])cy0[X]=Y;if(Y>cy1[X])cy1[X]=Y}
        done.forEach(q=>{const X=q%W,Y=(q-X)/W;if(X>rx0[Y]&&X<rx1[Y]&&Y>cy0[X]&&Y<cy1[X]&&!(X<4||Y<4||X>=W-4||Y>=H-4))return;d[q*4]=d[q*4+1]=d[q*4+2]=255});x.putImageData(id,0,0)}}
    const bg=i=>d[i]>236&&d[i+1]>236&&d[i+2]>236;
    // so recorta quando a borda da imagem e praticamente toda branca (foto de produto)
    let edge=0,white=0;for(let X=0;X<W;X++){for(const Y of [0,H-1]){edge++;if(bg((Y*W+X)*4))white++}}for(let Y=0;Y<H;Y++){for(const X of [0,W-1]){edge++;if(bg((Y*W+X)*4))white++}}
    let out=c,trim=false;
    if(white/edge>.9){let x0=W,y0=H,x1=-1,y1=-1;
      for(let Y=0;Y<H;Y++)for(let X=0;X<W;X++)if(!bg((Y*W+X)*4)){if(X<x0)x0=X;if(X>x1)x1=X;if(Y<y0)y0=Y;if(Y>y1)y1=Y}
      if(x1>x0&&y1>y0){const w=x1-x0+1,h=y1-y0+1,m=Math.max(8,Math.round(Math.max(w,h)*.04));
        out=document.createElement('canvas');out.width=w+2*m;out.height=h+2*m;const o=out.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,out.width,out.height);o.drawImage(c,x0,y0,w,h,m,m,w,h);trim=true}}
    const png=trim&&out.width*out.height<=2600000;
    return await new Promise(ok=>out.toBlob(b=>ok(b||file),png?'image/png':'image/jpeg',png?undefined:.92));
  }catch(e){return file}finally{URL.revokeObjectURL(url)}
}

/* ---------- troca do relogio do horimetro ----------
   O relogio novo comeca noutra contagem. Para nao quebrar o cronograma, cada item do plano e
   deslocado pela diferenca (novo − antigo): as horas que faltavam para cada troca continuam as mesmas.
   As preventivas antigas continuam com as leituras do relogio antigo. */
/* ---------- protecoes de horimetro usadas por todo o app ----------
   hmDeltaApos: soma das trocas de relogio registradas DEPOIS da data do lancamento (converte leitura antiga para a contagem atual)
   hmRecua: leitura menor que a atual, com data igual ou posterior a ultima leitura (impossivel sem troca de relogio) */
const _hmIx={};const hmTrocas=eqId=>{if(_hmIx.a!==S.trocas){_hmIx.a=S.trocas;_hmIx.m={};S.trocas.forEach(t=>{if(t.tipo==='hmtroca')(_hmIx.m[t.equipId]=_hmIx.m[t.equipId]||[]).push(t)})}return (_hmIx.m[eqId]||[]).slice()};
const hmDeltaApos=(eqId,dt)=>Math.round(hmTrocas(eqId).filter(t=>(t.data||'')>(dt||'')).reduce((a,t)=>a+(Number(t.delta)||0),0)*10)/10;
const hmRecua=(e,h,dt)=>e.horimetro!==''&&e.horimetro!=null&&h<Number(e.horimetro)&&(dt||'')>=(e.horimetroData||'');
/* informacao lancada antes de uma troca de relogio e mostrada como foi lida (sem converter) */
const hmOrig=(eqId,v,dt)=>{const d=hmDeltaApos(eqId,dt);return {v:Math.round((Number(v)-d)*10)/10,d}};
/* salto impossivel: mais de 24 h por dia desde a ultima leitura (provavel erro de digitacao) */
function hmSalto(e,h,dt){if(e.horimetro===''||e.horimetro==null||!e.horimetroData)return null;const last=Number(e.horimetro);if(!(h>last))return null;
  if((dt||'')<e.horimetroData)return null;const days=Math.max(1,Math.round((Date.parse(dt)-Date.parse(e.horimetroData))/864e5));const lim=24*days;
  return h-last>lim?{dif:Math.round((h-last)*10)/10,days,lim}:null}
function hmGuard(box,e,h0,dt,st,again){

  const f=rdFind(txt),ref=rdRef(txt),lido=f.lista.length===1&&!f.aprox?stCod(f.lista[0]):(ref||txt);fr.classList.add('ok');
  const again=()=>{r.paused=false;r.last='';box.hidden=true;act.hidden=false;fr.classList.remove('ok');st.textContent='Aponte para o codigo ou enquadre o texto';r.lastCode=performance.now()};
  const done=v=>{const u=r.use;rdClose();u(v)};
  box.hidden=false;act.hidden=true;
  const row=s=>`<button type="button" class="rdr-it" data-rit="${esc(s.id)}">${esRow(s,{tag:'div'})}</button>`;
  if(r.mode==='raw'){st.textContent=tipo==='texto'?'Texto lido':'Codigo lido';
    box.innerHTML=`<div class="rdr-c"><span class="rdr-k">Lido · ${tipo}</span><b class="rdr-v num">${esc(lido)}</b>${f.lista.length?`<span class="rdr-k">${f.aprox?'Parecido com':'No estoque'}: ${f.lista.map(x=>esc(stCod(x)+' · '+x.desc)).join(', ')}</span>`:''}</div>
      <button type="button" class="btn pri" data-u>Usar ${esc(lido)}</button><button type="button" class="btn" data-a>Ler outro</button>`;
    box.querySelector('[data-u]').onclick=()=>done({text:lido});box.querySelector('[data-a]').onclick=again;return}
  if(f.lista.length){st.textContent='Item encontrado';
    box.innerHTML=`<div class="rdr-c"><span class="rdr-k">Lido · ${tipo}${f.aprox?' · leitura parecida':''}</span><b class="rdr-v num">${esc(txt.length>40?txt.slice(0,40)+'…':txt)}</b>${f.lista.length>1||f.aprox?'<span class="rdr-k">Toque no item certo</span>':''}<div class="rdr-l">${f.lista.map(row).join('')}</div></div>
      ${f.lista.length===1&&!f.aprox?'<button type="button" class="btn pri" data-u>Usar este item</button>':''}<button type="button" class="btn" data-a>Ler outro</button>`;
    box.querySelectorAll('[data-rit]').forEach(b=>b.onclick=()=>done({item:stById(b.dataset.rit)}));const u=box.querySelector('[data-u]');if(u)u.onclick=()=>done({item:f.lista[0]});
    box.querySelector('[data-a]').onclick=again;return}
  /* nao esta no estoque: referencia → cadastrar em destaque; numero sem referencia → ligar em destaque */
  st.textContent=tipo==='texto'?'Texto lido':'Codigo lido';const code=tipo!=='texto'?txt:'';
  const bC=`<button type="button" class="btn ${ref?'pri':''}" data-c>Cadastrar item${ref?' '+esc(ref):''}</button>`,bL=code?`<button type="button" class="btn ${ref?'':'pri'}" data-l>Ligar a um item existente</button>`:'';
  box.innerHTML=`<div class="rdr-c"><span class="rdr-k">Lido · ${tipo}</span><b class="rdr-v num">${esc(ref||(txt.length>40?txt.slice(0,40)+'…':txt))}</b><div class="rdr-no">${ref?'Esta peca nao esta no estoque.':'Codigo ainda nao ligado a nenhum item.'}</div></div>
    ${ref?bC+bL:bL+bC}<button type="button" class="btn ghost" data-a>Ler outro</button>`;
  box.querySelector('[data-a]').onclick=again;
  box.querySelector('[data-c]').onclick=()=>{const u=r.use,pre={ref:ref||''};if(code&&!ref)pre.eans=[code];else if(code)pre.eans=[code];rdClose();
    const cb=async id=>{setTimeout(()=>{const x=stById(id);if(x)u({item:x})},350)};cb.msg='Item cadastrado';formStock(null,pre,cb)};
  const l=box.querySelector('[data-l]');if(l)l.onclick=()=>{
    box.innerHTML=`<div class="rdr-c"><span class="rdr-k">Ligar ${esc(code.length>24?code.slice(0,24)+'…':code)} a qual item?</span><div class="search">${I.search}<input type="search" data-q placeholder="Codigo, referencia ou descricao" autocomplete="off"></div><div class="rdr-l" data-ll></div></div><button type="button" class="btn ghost" data-a>Cancelar</button>`;
    const q=box.querySelector('[data-q]'),ll=box.querySelector('[data-ll]');const draw=()=>{const k=nzCod(q.value);ll.innerHTML=S.estoque.filter(x=>!isKit(x)&&(!k||nzCod(x.codigo).includes(k)||nzCod(x.ref).includes(k)||nzCod(x.desc).includes(k))).sort(byCode).slice(0,30).map(row).join('')||'<p class="note" style="margin:6px 2px">Nenhum item.</p>';
      ll.querySelectorAll('[data-rit]').forEach(b=>b.onclick=async()=>{const x=stById(b.dataset.rit);const eans=[...new Set([...(x.eans||[]),code])];
        if(await safe(()=>S.db.doc('estoque/'+x.id).update({eans}),'Codigo ligado a '+stCod(x)))done({item:{...x,eans}})})};
    q.oninput=draw;draw();box.querySelector('[data-a]').onclick=again}}

/* ---------- dados ---------- */
(async()=>{
  const db=window.claude&&window.claude.use?await window.claude.use('db'):null;
  window.claude&&window.claude.use&&window.claude.use('assets').then(a=>{S.assets=a;if(sheetOpen)refreshSheet()}).catch(()=>{});
  S.db=db;const sy=$('#sync');
  if(!db){sy.textContent='Offline';sy.className='sync off';render();return}
  const sub=(col,key,lk)=>db.collection(col).onSnapshot(snap=>{S[key]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded[lk]=1;
      sy.textContent='Sincronizado';sy.className='sync on';if(!sheetOpen)render();else refreshSheet()},
    err=>{sy.textContent='Sem sincronia';sy.className='sync off';console.error(err)});
  db.doc('config/equivalencias').onSnapshot(d=>{S.equiv=(d.exists&&d.data().pares)||[];if(!sheetOpen)render();else refreshSheet()},err=>console.error(err));
  db.doc('config/listas').onSnapshot(d=>{applyCfg(d.exists?d.data():null);S.loaded.c=1;if(!sheetOpen)render();else refreshSheet()},err=>{S.loaded.c=1;console.error(err)});
  $('#fab').hidden=false;
  sub('equipamentos','equips','e');sub('trocas','trocas','t');sub('estoque','estoque','s');sub('listas','listas','l');
  if(window.__frotaEu){$('#bell').hidden=false;fitTop();
    db.collection('avisos').onSnapshot(sn=>{S.avisos=sn.docs.map(d=>({id:d.id,...d.data()}));pintaSino();if(sheetOpen&&/^(avs|av):/.test((NAV[NAV.length-1]||{}).key||''))refreshSheet()},err=>console.error(err));
    db.doc('config/equipe').onSnapshot(d=>{S.equipe=(d.exists&&d.data().pessoas)||[]},err=>console.error(err))}
  db.doc('config/compras').onSnapshot(d=>{S.cart=(d.exists&&d.data().itens)||[];cartBtn();if(!sheetOpen)render();else refreshSheet()},err=>console.error(err));
})();
})();
</script>
