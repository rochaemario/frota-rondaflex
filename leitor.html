<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2470">
<title>Teste do Leitor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: uma tela de câmera — cabeçalho da frota, visor com retângulo, resultado logo abaixo */
:root{
  --bg:#edf0f5;--surface:#fff;--sunk:#f3f5f9;--line:#dfe4ec;--fg:#121a2c;--muted:#4f5a70;--faint:#677289;
  --ink:#0b2470;--accent:#0033a0;--accent-soft:#e2e9f8;--red:#e30613;
  --ok:#1b6638;--ok-bg:#e2f1e7;--warn:#8a4b00;--warn-bg:#fbeed6;--bad:#a3271c;--bad-bg:#f8e1dd;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:10px;line-height:1}
.brand i{width:10px;height:20px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--red) 0 4px,#fff 4px 8px)}
header small{margin-left:auto;font-size:12px;color:#a9b8e6}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer;width:100%}
.btn.sec{background:var(--surface);color:var(--accent)}.btn:disabled{opacity:.5}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row{display:grid;grid-template-columns:1fr auto;gap:8px}.row .btn.ic{width:52px}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;left:8%;right:8%;top:40%;height:20%;border:2px solid #fff;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35);transition:border-color .2s}
.frame.hit{border-color:#4fd18a}
.st{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;color:#fff;font-size:13px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.card{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(11,36,112,.06),0 4px 14px rgba(11,36,112,.06)}
.card h2{margin:0;font-size:14px;font-weight:600}.card p{margin:0;font-size:13px;color:var(--muted)}
.lido{font-family:var(--mono);font-size:20px;font-weight:600;word-break:break-all}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.m{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--ok-bg)}
.m b{font-family:var(--mono);font-size:14px}.m span{font-size:13px;color:var(--fg)}
.none{padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.dg div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}.dg div:first-child{border-top:0}
.dg span{color:var(--faint)}.dg b{font-weight:600;text-align:right;overflow-wrap:anywhere;min-width:0}
.ok{color:var(--ok)}.no{color:var(--bad)}
.hist{margin:0;padding-left:18px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="brand"><i></i>Controle de Frota</div><small>teste do leitor</small></header>
<main>
  <button class="btn" id="abrir"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Abrir leitor</button>
  <div class="cam" id="cam" hidden><video id="v" playsinline muted></video><div class="frame" id="fr"></div><div class="st" id="st">Aponte para um código ou enquadre o texto no retângulo</div></div>
  <div class="row" id="ctl" hidden><button class="btn sec" id="agora">Ler texto agora</button><button class="btn sec ic" id="luz" aria-label="Lanterna" title="Lanterna"><svg viewBox="0 0 24 24"><path d="M9 2h6l-1 6h-4zM10 8h4v12a2 2 0 0 1-4 0z"/></svg></button></div>
  <button class="btn sec" id="fechar" hidden>Fechar leitor</button>

  <section class="card" id="res" hidden><h2>Lido</h2><div class="lido" id="lido"></div><div><span class="tag" id="tipo"></span></div><div id="match"></div><ol class="hist" id="hist"></ol></section>

  <section class="card"><h2>Diagnóstico</h2><p>Se algo não funcionar, me mande um print desta parte.</p><div class="dg" id="dg"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const D={};const set=(k,v,c)=>{D[k]=[v,c||''];$('dg').innerHTML=Object.entries(D).map(([a,[b,cl]])=>`<div><span>${a}</span><b class="${cl}">${String(b).replace(/</g,'&lt;')}</b></div>`).join('')};
  const FMT={ean_13:'EAN-13',ean_8:'EAN-8',code_128:'Code 128',code_39:'Code 39',code_93:'Code 93',qr_code:'QR code',upc_a:'UPC-A',upc_e:'UPC-E',itf:'ITF',data_matrix:'Data Matrix',codabar:'Codabar',pdf417:'PDF417',aztec:'Aztec'};

  /* ---------- estoque real (para comparar) ---------- */
  const canon=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1').replace(/S/g,'5').replace(/B/g,'8').replace(/Z/g,'2');
  let itens=[];
  (async()=>{try{const C=window.FROTA_CFG;const sb=supabase.createClient(C.url,C.key);const {data:{session}}=await sb.auth.getSession();
    if(!session){set('Estoque','entre no app antes para comparar','no');return}
    const {data,error}=await sb.from('docs').select('path,data').eq('parent','estoque');if(error)throw error;
    itens=data.map(r=>({id:r.path.split('/').pop(),...r.data})).map(s=>({s,keys:[s.codigo,s.ref,s.ean,...(s.eans||[])].filter(Boolean).map(canon).filter(k=>k.length>=4)}));
    set('Estoque',itens.length+' itens carregados','ok')}catch(e){set('Estoque','não carregou ('+(e.message||e)+')','no')}})();
  function procurar(txt){const t=canon(txt);if(t.length<4)return [];return itens.filter(x=>x.keys.some(k=>t.includes(k)||(k.includes(t)&&t.length>=6))).map(x=>x.s)}

  /* ---------- resultado ---------- */
  const hist=[];let ultimo='';
  function mostrar(texto,tipo,achados){$('res').hidden=false;$('lido').textContent=texto;$('tipo').textContent=tipo;
    $('match').innerHTML=achados.length?achados.map(s=>`<div class="m"><b>${(s.codigo||s.ref||'').replace(/</g,'&lt;')}</b><span>${(s.desc||'').replace(/</g,'&lt;')}</span></div>`).join(''):'<div class="none">Nenhum item do estoque com esse código.</div>';
    if(hist[0]!==texto){hist.unshift(texto);hist.length=Math.min(hist.length,6);$('hist').innerHTML=hist.slice(1).map(h=>`<li>${h.replace(/</g,'&lt;')}</li>`).join('')}
    try{navigator.vibrate&&navigator.vibrate(achados.length?[40,60,40]:60)}catch(e){}}

  /* ---------- câmera ---------- */
  let stream=null,track=null,det=null,raf=0,lastCode=0,ocrBusy=false,ocrTimer=0,worker=null,parado=false;
  const v=$('v');
  set('Aparelho',/Android/.test(navigator.userAgent)?'Android':/iPhone|iPad/.test(navigator.userAgent)?'iPhone/iPad':'Computador');
  set('Instalado',matchMedia('(display-mode: standalone)').matches?'sim (app)':'não (navegador)');
  (async()=>{try{if('BarcodeDetector' in window){const f=await BarcodeDetector.getSupportedFormats();det=new BarcodeDetector({formats:f});set('Códigos',f.map(x=>FMT[x]||x).join(', '),'ok')}else set('Códigos','sem leitor nativo neste aparelho','no')}catch(e){set('Códigos','erro: '+e.message,'no')}})();

  async function abrir(){
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false})}
    catch(e){set('Câmera','bloqueada ('+(e.name||e)+')','no');return}
    set('Câmera','funcionando','ok');track=stream.getVideoTracks()[0];
    try{const c=track.getCapabilities?track.getCapabilities():{};if(c.focusMode&&c.focusMode.includes('continuous'))await track.applyConstraints({advanced:[{focusMode:'continuous'}]});$('luz').hidden=!c.torch}catch(e){$('luz').hidden=true}
    v.srcObject=stream;await v.play().catch(()=>{});
    $('cam').hidden=false;$('ctl').hidden=false;$('fechar').hidden=false;$('abrir').hidden=true;parado=false;lastCode=performance.now();
    loop();agendaOcr(2000);
  }
  function fechar(){parado=true;cancelAnimationFrame(raf);clearTimeout(ocrTimer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;track=null;
    $('cam').hidden=true;$('ctl').hidden=true;$('fechar').hidden=true;$('abrir').hidden=false}
  $('abrir').onclick=abrir;$('fechar').onclick=fechar;
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&stream)fechar()});
  let luz=false;$('luz').onclick=async()=>{luz=!luz;try{await track.applyConstraints({advanced:[{torch:luz}]})}catch(e){}};

  /* códigos de barras e QR: leitura contínua, imediata */
  let busy=false,lt=0;
  function loop(){raf=requestAnimationFrame(async ts=>{if(parado)return;loop();if(!det||busy||ts-lt<180||v.readyState<2)return;busy=true;lt=ts;
    try{const r=await det.detect(v);if(r.length){const c=r[0];lastCode=performance.now();
      if(c.rawValue!==ultimo){ultimo=c.rawValue;$('fr').classList.add('hit');setTimeout(()=>$('fr').classList.remove('hit'),600);
        mostrar(c.rawValue,FMT[c.format]||c.format,procurar(c.rawValue));$('st').textContent='Código lido'}}}catch(e){}busy=false})}

  /* texto: tenta sozinho quando não há código no quadro */
  function recorte(){const vw=v.videoWidth,vh=v.videoHeight,cw=v.clientWidth,ch=v.clientHeight;if(!vw)return null;
    const s=Math.max(cw/vw,ch/vh),ox=(vw*s-cw)/2,oy=(vh*s-ch)/2;
    const fx=(cw*.08+ox)/s,fy=(ch*.40+oy)/s,fw=cw*.84/s,fh=ch*.20/s;
    const k=Math.min(2.2,1400/fw),c=document.createElement('canvas');c.width=Math.round(fw*k);c.height=Math.round(fh*k);const g=c.getContext('2d');
    g.filter='grayscale(1) contrast(1.6)';g.drawImage(v,fx,fy,fw,fh,0,0,c.width,c.height);return c}
  async function ocrWorker(){if(worker)return worker;set('Leitor de texto','carregando (só na primeira vez)…');
    await new Promise((ok,ko)=>{if(window.Tesseract)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>ko(new Error('não carregou'));document.head.appendChild(s)});
    worker=await Tesseract.createWorker('eng');await worker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-./ ',tessedit_pageseg_mode:'6'});
    set('Leitor de texto','pronto','ok');return worker}
  function agendaOcr(ms){clearTimeout(ocrTimer);ocrTimer=setTimeout(()=>lerTexto(false),ms)}
  async function lerTexto(forcado){if(parado)return;
    if(!forcado&&performance.now()-lastCode<2000){agendaOcr(1200);return}
    if(ocrBusy){if(!forcado)agendaOcr(1500);return}ocrBusy=true;$('agora').disabled=true;$('st').textContent='Lendo texto…';
    try{const w=await ocrWorker();const c=recorte();if(c){const t0=performance.now();const {data}=await w.recognize(c);const ms=Math.round(performance.now()-t0);
        const linhas=(data.text||'').split('\n').map(x=>x.trim()).filter(x=>x.replace(/[^A-Z0-9]/gi,'').length>=4);
        set('Tempo da leitura',ms+' ms');set('Confiança',Math.round(data.confidence||0)+'%');
        let achou=false;for(const l of linhas){const a=procurar(l);if(a.length){mostrar(l,'Texto',a);achou=true;break}}
        if(!achou&&linhas.length&&(forcado||Math.round(data.confidence||0)>=60))mostrar(linhas.join(' · '),'Texto',[]);
        $('st').textContent=achou?'Texto reconhecido':(linhas.length?'Texto lido, sem item igual no estoque':'Nenhum texto no retângulo');
        if(achou){ocrBusy=false;$('agora').disabled=false;agendaOcr(6000);return}}}
    catch(e){set('Leitor de texto','erro: '+(e.message||e),'no');$('st').textContent='Leitor de texto indisponível'}
    ocrBusy=false;$('agora').disabled=false;agendaOcr(2500)}
  $('agora').onclick=()=>lerTexto(true);
})();
</script>
</body>
</html>
