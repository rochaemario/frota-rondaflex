  nav('cbx:mse',()=>cbxMseEq(g,m));const l=g.l.slice().sort((a,b)=>(b.data||'').localeCompare(a.data||'')||(b.ts||0)-(a.ts||0));
  openSheet({title:esc(g.nome),sub:esc(['MSE',cbxMesNome(m)+' '+m.slice(0,4)].join(' · ')),
  body:`${g.placa||g.dono?`<p class="note" style="margin:0 2px 10px">${esc([g.placa&&'Placa '+g.placa,g.dono].filter(Boolean).join(' · '))}</p>`:''}
    <div class="cb-ab rl-ms"><div class="cb-abh"><span>Data</span><span>Horimetro</span><span>Km</span><span>Litros</span></div>${l.map(f=>`<div class="cb-abr"><span>${fdate(f.data).slice(0,5)}${f.custo?`<i>${esc(cbxCuCurto(cbxCuNome(f.custo)))}</i>`:''}</span><span>${f.horimetro!=null&&f.horimetro!==''?nf(f.horimetro,1):'—'}</span><span>${f.km!=null&&f.km!==''?nf(f.km,0):'—'}</span><span>${nf(f.litros,1)}<i>L</i></span></div>`).join('')}</div>
    <div class="cbx-io big" style="margin-top:12px"><div><small>Total</small><b>${nf(g.lt,1)} L</b></div><div><small>Abastecimentos</small><b>${l.length}</b></div></div>`});
}

/* junta os dados do periodo, ja filtrados, no formato do informe */
async function cbxPdfDados(P,c){

  const hasF=P.cu&&c.custos.some(z=>z.pai===P.cu),cuSet=P.cu?(hasF?P.sub.slice():[P.cu]):null,eqSet=P.eqT==='esc'?new Set(P.eqs):null;
  const A=[],M=[];let ent=null,est=false;
  for(let m=de.slice(0,7);m<=ate.slice(0,7);m=mesSeg(m)){
    const [qa,qm,dm]=await Promise.all([S.db.collection('comb/'+m+'/abast').get(),S.db.collection('comb/'+m+'/mse').get(),P.v==='mes'?S.db.doc('comb/'+m).get():Promise.resolve(null)]);
    qa.docs.forEach(z=>{const x=z.data();if(x.data>=de&&x.data<=ate)A.push(x)});qm.docs.forEach(z=>{const x=z.data();if(x.data>=de&&x.data<=ate)M.push({...x,id:z.id})});
    if(dm){await cbxFechAll();const E=cbxEntMes(c,dm.exists?dm.data():{},m);ent=E.ent;est=E.est}}
  const okC=x=>!cuSet||cuSet.includes(x.custo);
  const A2=A.filter(x=>okC(x)&&(!eqSet||eqSet.has(x.equipId))),M2=P.mse?M.filter(okC):[];
  const r1=v=>Math.round(v*10)/10,L=x=>Number(x.litros)||0,sai=r1(A2.reduce((s,x)=>s+L(x),0)+M2.reduce((s,x)=>s+L(x),0));
  const pc=v=>sai?nf(v/sai*100,1):'0';
  /* centros de custo */
  const CU={};[...A2,...M2].forEach(x=>{const k=x.custo||'';CU[k]=r1((CU[k]||0)+L(x))});
  const cc=[];c.custos.filter(k=>!k.pai).forEach(k=>{const fs=c.custos.filter(z=>z.pai===k.id),own=CU[k.id]||0,tt=r1(own+fs.reduce((s,z)=>s+(CU[z.id]||0),0));if(!(tt>0))return;
    cc.push({c:[k.nome,nf(tt,1),pc(tt)],b:[0,1]});if(fs.length)[[k.nome.toLowerCase(),own],...fs.map(z=>[z.nome,CU[z.id]||0])].forEach(([n,v])=>cc.push({c:[n,nf(v,1),pc(v)],k:'s'}))});
  const semC=r1(Object.entries(CU).filter(([k])=>!c.custos.some(z=>z.id===k)).reduce((s,[,v])=>s+v,0));if(semC>0)cc.push({c:['Sem custo',nf(semC,1),pc(semC)],b:[0,1]});

/* prepara a foto antes de enviar: recorta o fundo branco em volta do objeto,
   centraliza com margem estreita e igual nos 4 lados, sem ampliar e sem mudar a proporcao */
/* modo 'proc' (Processada): limpa o fundo claro e recorta; modo 'orig' (Original): nao mexe no fundo,
   so deixa o quase-branco branco, recorta as margens brancas e redimensiona */
async function shrink(file,modo='proc'){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const M=2400,k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
    const W=Math.round(img.naturalWidth*k),H=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});
    x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(img,0,0,W,H);
    const id=x.getImageData(0,0,W,H),d=id.data;
    // fundo claro (branco, cinza ou degrade de estudio): pinta de branco a partir das bordas
    {let n=0,r=0,g=0,b=0;const bp=[];for(let X=0;X<W;X+=2)bp.push(X,(H-1)*W+X);for(let Y=0;Y<H;Y+=2)bp.push(Y*W,Y*W+W-1);
      bp.forEach(q=>{r+=d[q*4];g+=d[q*4+1];b+=d[q*4+2];n++});r/=n;g/=n;b/=n;
      const far=q=>Math.max(Math.abs(d[q*4]-r),Math.abs(d[q*4+1]-g),Math.abs(d[q*4+2]-b));
      const light=q=>Math.min(d[q*4],d[q*4+1],d[q*4+2])>175&&Math.abs((d[q*4]-d[q*4+2])-(r-b))<16&&Math.abs((d[q*4+1]-d[q*4+2])-(g-b))<16;
      if(modo==='proc'&&Math.min(r,g,b)>185&&bp.filter(q=>light(q)&&far(q)<35).length/bp.length>.8){
        const seen=new Uint8Array(W*H),st=[],band=[];for(let Y=0;Y<H;Y++)for(let X=0;X<W;X++)if(X<4||Y<4||X>=W-4||Y>=H-4)band.push(Y*W+X);band.forEach(q=>{if(light(q)&&far(q)<35){seen[q]=1;st.push(q)}});
        const step=(a,c)=>Math.max(Math.abs(d[a*4]-d[c*4]),Math.abs(d[a*4+1]-d[c*4+1]),Math.abs(d[a*4+2]-d[c*4+2]))<=6;
        const done=[];
        while(st.length){const q=st.pop();done.push(q);const X=q%W;
          for(const nq of [X>0?q-1:-1,X<W-1?q+1:-1,q-W,q+W])if(nq>=0&&nq<W*H&&!seen[nq]&&light(nq)&&far(nq)<35&&step(q,nq)){seen[nq]=1;st.push(nq)}}
        // devolve o que foi apagado por engano dentro do contorno do objeto (linha e coluna)
        const rx0=new Int32Array(H).fill(W),rx1=new Int32Array(H).fill(-1),cy0=new Int32Array(W).fill(H),cy1=new Int32Array(W).fill(-1);
        for(let Y=0;Y<H;Y++)for(let X=0;X<W;X++)if(!seen[Y*W+X]){if(X<rx0[Y])rx0[Y]=X;if(X>rx1[Y])rx1[Y]=X;if(Y<cy0[X])cy0[X]=Y;if(Y>cy1[X])cy1[X]=Y}
        done.forEach(q=>{const X=q%W,Y=(q-X)/W;if(X>rx0[Y]&&X<rx1[Y]&&Y>cy0[X]&&Y<cy1[X]&&!(X<4||Y<4||X>=W-4||Y>=H-4))return;d[q*4]=d[q*4+1]=d[q*4+2]=255});
        /* conferencia: se o contorno da peca ficou serrilhado (pedacos comidos), desiste e usa a Original */
        {const wb=i=>d[i]>236&&d[i+1]>236&&d[i+2]>236;let pl=-1,pr=-1,sj=0,sw=0,n=0;
          for(let Y=0;Y<H;Y+=2){let l=-1,r2=-1;for(let X=0;X<W;X++)if(!wb((Y*W+X)*4)){l=X;break}if(l<0){pl=-1;continue}for(let X=W-1;X>=0;X--)if(!wb((Y*W+X)*4)){r2=X;break}
            if(pl>=0){sj+=Math.abs(l-pl)+Math.abs(r2-pr);sw+=r2-l;n++}pl=l;pr=r2}
          if(n>10&&sj/Math.max(1,sw)>(shrink.lim||.028))return await shrink(file,'orig')}
        x.putImageData(id,0,0)}}
    /* original: so o quase-branco vira branco (fundo branco fica limpo e some na tela) */
    if(modo==='orig'){for(let i=0;i<d.length;i+=4){const mn=Math.min(d[i],d[i+1],d[i+2]),mx=Math.max(d[i],d[i+1],d[i+2]);if(mn>244&&mx-mn<8){d[i]=d[i+1]=d[i+2]=255}}x.putImageData(id,0,0)}
    const bg=i=>d[i]>236&&d[i+1]>236&&d[i+2]>236;
    // so recorta quando a borda da imagem e praticamente toda branca (foto de produto)
    let edge=0,white=0;for(let X=0;X<W;X++){for(const Y of [0,H-1]){edge++;if(bg((Y*W+X)*4))white++}}for(let Y=0;Y<H;Y++){for(const X of [0,W-1]){edge++;if(bg((Y*W+X)*4))white++}}
    let out=c,trim=false;
    if(white/edge>.9){let x0=W,y0=H,x1=-1,y1=-1;
      for(let Y=0;Y<H;Y++)for(let X=0;X<W;X++)if(!bg((Y*W+X)*4)){if(X<x0)x0=X;if(X>x1)x1=X;if(Y<y0)y0=Y;if(Y>y1)y1=Y}
      if(x1>x0&&y1>y0){const w=x1-x0+1,h=y1-y0+1,m=Math.max(8,Math.round(Math.max(w,h)*.04));
        out=document.createElement('canvas');out.width=w+2*m;out.height=h+2*m;const o=out.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,out.width,out.height);o.drawImage(c,x0,y0,w,h,m,m,w,h);trim=true}}
    const png=trim&&out.width*out.height<=2600000;
    return await new Promise(ok=>out.toBlob(b=>ok(b||file),png?'image/png':'image/jpeg',png?undefined:.92));
  }catch(e){return file}finally{URL.revokeObjectURL(url)}
}

const hmLow=(e,v,dt)=>e.horimetro!==''&&e.horimetro!=null&&Number(v)+(dt?hmDeltaApos(e.id,dt):0)<Number(e.horimetro);
const lidoHoje=e=>e.horimetroData===today()||e.horimetroReg===today();
function quickHm(){
  const el=$('#sidetabs');if(!el)return;
  if(!S.db||!S.eqCtl.length){el.hidden=true;return}
  const t=today(),lidos=S.eqCtl.filter(lidoHoje).length,n=S.eqCtl.length;
  el.hidden=false;const sn=el.querySelector('.sh-n');sn.textContent=`${lidos}/${n}`;sn.classList.toggle('zero',!lidos);sn.classList.toggle('all',lidos>=n);quickHm.day=t;
  $('#sidehm').setAttribute('aria-label',`Horimetros, ${lidos} de ${n} lidos hoje`);
}
const hmGroupOf=e=>e.alocacao||'';
/* faixa de dias da leitura (ultimos 21 dias, hoje no fim). Ponto vermelho: dia com leitura lancada
   em algum equipamento. O icone de calendario abre o seletor para datas mais antigas; datas futuras bloqueadas */
const DSEM=['DOM','SEG','TER','QUA','QUI','SEX','SAB'];
const CAL_IC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>';
function dayStrip(sel,o){o=o||{};
  const t=today(),lidos=o.on||new Set(S.eqCtl.map(e=>e.horimetroData).filter(Boolean));
  const d0=new Date(t+'T12:00:00');d0.setDate(d0.getDate()-20);
  let ini=iso(d0);if(sel&&sel<ini)ini=sel;
  const out=[];for(const d=new Date(ini+'T12:00:00');iso(d)<=t;d.setDate(d.getDate()+1)){const k=iso(d);
    const nome=k===t?'HOJE':DSEM[d.getDay()];
    out.push(`<button type="button" class="dday" data-dd="${k}" aria-pressed="${k===sel}" aria-label="${nome} ${fdate(k)}"><small>${nome}</small><b>${d.getDate()}</b><i class="${lidos.has(k)?'on':''}"></i></button>`)}
  return `<div class="dstrip-l"><span>${o.lbl||'Data da leitura'}</span><b>${sel===t?'Hoje':''} ${fdate(sel)}</b></div>
  <div class="dstrip-w"><div class="dstrip">${out.join('')}</div><label class="dcal" aria-label="Escolher outra data">${CAL_IC}<input id="${o.id||'lr-dt'}" type="date" max="${t}" value="${esc(sel)}"></label></div>`}
function formLeituras(focusId){
  nav('leit',()=>formLeituras());
  const D=hmDraft();D.v=D.v||{};D.jok=false;/* data da leitura: sempre hoje; uma data alterada vale so para aquele dia */if(!D.dt||D.dtDia!==today()){D.dt=today();delete D.dtDia}D.g=D.g??'';if(focusId)D.g='';
  const t=today();
  const groups=['','PQ','DM1'];if(!groups.includes(D.g))D.g='';
  const list=S.eqCtl.filter(e=>!D.g||hmGroupOf(e)===D.g).sort((a,b)=>tipoOrd(a.tipo,b.tipo)||byCode(a,b));
  let lastT='';
  /* faixa lateral pela idade da leitura: verde < 7 dias, amarelo 7–15, vermelho > 15.
     Com preventiva a menos de 100 h: verde < 3 dias, amarelo 3–4, vermelho 5 ou mais. Sem leitura: vermelho */
  const idade=e=>{const dt=lidoHoje(e)?t:e.horimetroData;if(!dt||e.horimetro===''||e.horimetro==null)return 'r';
    const d=Math.max(0,Math.round((Date.parse(t)-Date.parse(dt))/864e5));
    const perto=(e.itens||[]).some(it=>{const r=itemStatus(e,it).rest;return isFinite(r)&&r<100});
    return perto?(d>=5?'r':d>=3?'y':'g'):(d>15?'r':d>=7?'y':'g')};
  const jmp=(e,v)=>v===''?null:hmSalto(e,Number(v)+hmDeltaApos(e.id,D.dt),D.dt);
  const jtx=j=>j?`Confira: +${nf(j.dif)} h em ${j.days} dia${j.days>1?'s':''}`:'';
  const rows=list.map(e=>{const v=D.v[e.id]??'',low=v!==''&&e.horimetro!==''&&e.horimetro!=null&&Number(v)<Number(e.horimetro),jp=!low&&jmp(e,v),id8=idade(e);
    const head=e.tipo!==lastT?`<div class="lr-t">${esc(lastT=e.tipo||'Sem tipo')}</div>`:'';
    return head+`<div class="lr lr-${id8}${v!==''?' fill':''}${low?' low':''}" data-id="${esc(e.id)}"><div class="lr-i"><span class="lr-c">${esc(e.codigo)}</span>
      <span class="lr-p">${e.horimetro!==''&&e.horimetro!=null?`ultima <b>${nf(e.horimetro,2)}</b> h${e.horimetroData?` · ${sdate(e.horimetroData)}`:''}`:'sem leitura'}${lidoHoje(e)?' <span class="ok-tag">lido hoje</span>':''}</span>
      <span class="lr-w">${low?`Nao pode ser menor que ${nf(e.horimetro,2)} h`:jtx(jp)}</span><button type="button" class="lr-x" data-thm="${esc(e.id)}"${low?'':' hidden'}>Trocou o relogio do horimetro?</button></div>
      <input class="lr-in" type="number" step="0.1" inputmode="decimal" enterkeyhint="next" placeholder="${e.horimetro!==''&&e.horimetro!=null?nf(e.horimetro,2):'—'}" value="${esc(v)}" aria-label="Horimetro de ${esc(e.codigo)}"></div>`}).join('');
  const cnt=Object.keys(D.v).length;
  openSheet({title:'Lancar horimetros',sub:'So as preenchidas sao salvas',
  body:`<div class="lr-top">${dayStrip(D.dt)}</div>
    <div class="chips lr-chips">${groups.map(g=>`<button class="chip" data-g="${esc(g)}" aria-pressed="${D.g===g}">${esc(g||'Todos')} <em>${g?S.eqCtl.filter(e=>hmGroupOf(e)===g).length:S.equips.length}</em></button>`).join('')}</div>
    <div class="lr-list">${rows||'<div class="empty">Nenhum equipamento neste grupo.</div>'}</div><div id="lr-conf"></div>`,
  foot:`<button class="btn pri" id="lr-save"${cnt?'':' disabled'}>${cnt?`Salvar ${cnt} leitura${cnt===1?'':'s'}`:'Salvar leituras'}</button>`,
  mount:sh=>{
    const upd=()=>{const c=Object.keys(D.v).length,b=sh.querySelector('#lr-save');b.disabled=!c;b.textContent=c?`Salvar ${c} leitura${c===1?'':'s'}`:'Salvar leituras';hmDraftSave(D)};
    const setDt=v=>{v=v||today();if(v>today())v=today();D.dt=v;if(D.dt===today())delete D.dtDia;else D.dtDia=today();hmDraftSave(D);
      const top=sh.querySelector('.lr-top');top.innerHTML=dayStrip(D.dt);bindStrip()};
    const bindStrip=()=>{const top=sh.querySelector('.lr-top');
      top.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>setDt(b.dataset.dd));
      top.querySelector('#lr-dt').onchange=ev=>setDt(ev.target.value);
      const st=top.querySelector('.dstrip'),sel=st.querySelector('[aria-pressed="true"]');
      st.scrollLeft=st.scrollWidth;if(sel&&sel.offsetLeft<st.scrollLeft)st.scrollLeft=sel.offsetLeft-4};
    bindStrip();
    sh.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{D.g=b.dataset.g;hmDraftSave(D);formLeituras();sh.querySelector('.sh-body').scrollTop=0});
    const ins=[...sh.querySelectorAll('.lr-in')];
    ins.forEach((inp,i)=>{const row=inp.closest('.lr'),e=eqById(row.dataset.id);
      inp.oninput=()=>{const v=inp.value.trim();if(v==='')delete D.v[e.id];else D.v[e.id]=v;
        const low=v!==''&&hmLow(e,v,D.dt);
        row.classList.toggle('fill',v!=='');row.classList.toggle('low',low);row.querySelector('.lr-w').textContent=low?`Nao pode ser menor que ${nf(e.horimetro,2)} h`:jtx(jmp(e,v));D.jok=false;sh.querySelector('#lr-conf').innerHTML='';row.querySelector('.lr-x').hidden=!low;upd()};
      inp.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();const nx=ins[i+1];nx?nx.focus():inp.blur()}};
      inp.onfocus=()=>row.scrollIntoView({block:'center',behavior:'smooth'})});
    sh.querySelectorAll('[data-thm]').forEach(b=>b.onclick=()=>formTrocaHm(b.dataset.thm,D.v[b.dataset.thm]));
    if(focusId){const fi=ins.find(i=>i.closest('.lr').dataset.id===focusId);if(fi){fi.closest('.lr').scrollIntoView({block:'center'});setTimeout(()=>fi.focus({preventScroll:true}),250)}}
    const doSave=async()=>{const ids=Object.keys(D.v).filter(id=>eqById(id));let ok=0;
      const b=sh.querySelector('#lr-save');b.disabled=true;b.textContent='Salvando…';
      const res=await safe(async()=>{for(const id of ids){await S.db.doc('equipamentos/'+id).update({horimetro:Math.round((Number(D.v[id])+hmDeltaApos(id,D.dt))*10)/10,horimetroData:D.dt,horimetroReg:today(),horimetroPor:(EU()||{}).uid||'',horimetroEm:Date.now()});ok++;delete D.v[id];hmDraftSave(D)}},null);
      toast(res?`${ok} leitura${ok===1?'':'s'} salva${ok===1?'':'s'}`:`${ok} salvas. As demais ficaram no rascunho.`);
      if(res){D.v={};D.dt=today();delete D.dtDia;hmDraftSave(D);closeSheet()}else formLeituras()};
    /* a nova leitura precisa ser maior que a ultima registrada no equipamento */
    sh.querySelector('#lr-save').onclick=()=>{const lows=Object.entries(D.v).filter(([id,v])=>{const e=eqById(id);return e&&hmLow(e,v,D.dt)}).map(([id])=>eqById(id).codigo);
      if(lows.length){toast(`Corrija ${lows.join(', ')}: a leitura nao pode ser menor que a ultima.`);const r=sh.querySelector('.lr.low');r&&r.scrollIntoView({block:'center',behavior:'smooth'});return}
      /* salto acima de 24 h por dia: pede confirmacao antes de salvar */
      const js=D.jok?[]:Object.entries(D.v).map(([id,v])=>{const e=eqById(id);const j=e&&jmp(e,v);return j?`${e.codigo} (+${nf(j.dif)} h em ${j.days} dia${j.days>1?'s':''})`:''}).filter(Boolean);
      if(js.length){const box=sh.querySelector('#lr-conf');box.innerHTML=`<div class="eqv-ask"><b>Leitura muito acima do esperado</b><p class="note" style="margin:0">${esc(js.join(', '))}. Uma maquina trabalha no maximo 24 h por dia. Confira se nao houve erro de digitacao.</p><div class="eqv-f"><button type="button" class="btn" data-x>Revisar</button><button type="button" class="btn pri" data-go>Os valores estao certos</button></div></div>`;
        box.querySelector('[data-x]').onclick=()=>{box.innerHTML='';const r=[...sh.querySelectorAll('.lr')].find(r=>r.querySelector('.lr-w').textContent.startsWith('Confira'));r&&r.scrollIntoView({block:'center',behavior:'smooth'})};
        box.querySelector('[data-go]').onclick=()=>{D.jok=true;box.innerHTML='';doSave()};box.scrollIntoView({block:'center',behavior:'smooth'});return}
      doSave()};
  }});
}

/* ---------- troca do relogio do horimetro ----------
   O relogio novo comeca noutra contagem. Para nao quebrar o cronograma, cada item do plano e
   deslocado pela diferenca (novo − antigo): as horas que faltavam para cada troca continuam as mesmas.
   As preventivas antigas continuam com as leituras do relogio antigo. */
/* ---------- protecoes de horimetro usadas por todo o app ----------
   hmDeltaApos: soma das trocas de relogio registradas DEPOIS da data do lancamento (converte leitura antiga para a contagem atual)
   hmRecua: leitura menor que a atual, com data igual ou posterior a ultima leitura (impossivel sem troca de relogio) */
const _hmIx={};const hmTrocas=eqId=>{if(_hmIx.a!==S.trocas){_hmIx.a=S.trocas;_hmIx.m={};S.trocas.forEach(t=>{if(t.tipo==='hmtroca')(_hmIx.m[t.equipId]=_hmIx.m[t.equipId]||[]).push(t)})}return (_hmIx.m[eqId]||[]).slice()};
const hmDeltaApos=(eqId,dt)=>Math.round(hmTrocas(eqId).filter(t=>(t.data||'')>(dt||'')).reduce((a,t)=>a+(Number(t.delta)||0),0)*10)/10;
const hmRecua=(e,h,dt)=>e.horimetro!==''&&e.horimetro!=null&&h<Number(e.horimetro)&&(dt||'')>=(e.horimetroData||'');
/* informacao lancada antes de uma troca de relogio e mostrada como foi lida (sem converter) */
const hmOrig=(eqId,v,dt)=>{const d=hmDeltaApos(eqId,dt);return {v:Math.round((Number(v)-d)*10)/10,d}};
/* salto impossivel: mais de 24 h por dia desde a ultima leitura (provavel erro de digitacao) */
/* data mais antiga que a leitura atual, mas horimetro maior: um dos dois numeros esta errado */
const hmAtras=(e,h,dt)=>!!e&&e.horimetro!==''&&e.horimetro!=null&&!!e.horimetroData&&(dt||'')<e.horimetroData&&h>Number(e.horimetro);
function hmSalto(e,h,dt){if(ehVL(e))return null;if(e.horimetro===''||e.horimetro==null||!e.horimetroData)return null;const last=Number(e.horimetro);if(!(h>last))return null;
  if((dt||'')<e.horimetroData)return null;const days=Math.max(1,Math.round((Date.parse(dt)-Date.parse(e.horimetroData))/864e5));const lim=24*days;
  return h-last>lim?{dif:Math.round((h-last)*10)/10,days,lim}:null}
function hmGuard(box,e,h0,dt,st,again){
  const dl=hmDeltaApos(e.id,dt),h=Math.round((h0+dl)*10)/10;
  const show=(html,go)=>{box.innerHTML=`<div class="eqv-ask">${html}</div>`;box.querySelector('[data-x]').onclick=()=>box.innerHTML='';go(box.querySelector('[data-go]'));box.scrollIntoView({block:'start',behavior:'smooth'})};
  if(hmRecua(e,h,dt)&&!st.corr){show(`<b>Horimetro menor que o atual</b><p class="note" style="margin:0">${nf(h0,2)} h e menor que a ultima leitura de ${esc(e.codigo)} (${nf(e.horimetro,2)} h). Confira o valor. Se a leitura anterior estava errada, corrija. Se o relogio foi trocado, registre a troca.</p><div class="eqv-f hm-3"><button type="button" class="btn" data-x>Revisar</button><button type="button" class="btn" data-cor>Leitura anterior errada</button><button type="button" class="btn pri" data-go>Troca de horimetro</button></div>`,b=>b.onclick=()=>{box.innerHTML='';formTrocaHm(e.id,h0)});
    /* leitura anterior errada: o horimetro passa a ser o valor menor, sem troca de relogio; fica registrado na ficha */
    box.querySelector('[data-cor]').onclick=()=>{box.innerHTML=`<div class="eqv-ask"><b>Corrigir leitura anterior</b><p class="note" style="margin:0">A leitura de <b>${nf(e.horimetro,2)} h</b> estava errada. O horimetro de ${esc(e.codigo)} passa a ser <b>${nf(h,2)} h</b>, sem troca de relogio.</p><div class="eqv-f"><button type="button" class="btn" data-x>Cancelar</button><button type="button" class="btn pri" data-go>Confirmar correcao</button></div></div>`;
      box.querySelector('[data-x]').onclick=()=>box.innerHTML='';
      box.querySelector('[data-go]').onclick=async()=>{const cur=eqById(e.id)||e,u=EU();const reg={data:today(),de:Number(cur.horimetro),para:h,por:(u&&u.nome)||''};
        if(!await safe(()=>S.db.doc('equipamentos/'+e.id).update({horimetro:h,horimetroData:dt||today(),hmCorr:[...(cur.hmCorr||[]),reg]}),'Leitura corrigida'))return;
        st.corr=true;box.innerHTML='';setTimeout(again,150)}};
    return null}
  if(!st.salto){const sj=hmSalto(e,h,dt);if(sj){show(`<b>Horimetro muito acima do esperado</b><p class="note" style="margin:0">${nf(h0,2)} h fica ${nf(sj.dif)} h acima da ultima leitura de ${esc(e.codigo)} (${nf(e.horimetro,2)} h em ${fdate(e.horimetroData)}). Em ${sj.days} dia${sj.days>1?'s':''} a maquina trabalha no maximo ${nf(sj.lim)} h. Confira se nao houve erro de digitacao.</p><div class="eqv-f"><button type="button" class="btn" data-x>Revisar</button><button type="button" class="btn pri" data-go>O valor esta certo</button></div>`,b=>b.onclick=()=>{st.salto=true;box.innerHTML='';again()});return null}}
  if(dl&&!st.ok){const t=hmTrocas(e.id).filter(t=>(t.data||'')>(dt||'')).sort((a,b)=>(a.data||'').localeCompare(b.data||''))[0];
    show(`<b>Lancamento de antes da troca do relogio</b><p class="note" style="margin:0">O relogio de ${esc(e.codigo)} foi trocado em ${fdate(t.data)}. ${nf(h0,2)} h e do relogio antigo e equivale a <b>${nf(h,2)} h</b> no relogio atual. O cronograma usa o valor convertido.</p><div class="eqv-f"><button type="button" class="btn" data-x>Revisar</button><button type="button" class="btn pri" data-go>Converter e continuar</button></div>`,b=>b.onclick=()=>{st.ok=true;box.innerHTML='';again()});return null}
  return {h,dl};
}
function formTrocaHm(eqId,novo0){

  const eqs=S.eqCtl.slice().sort(byCode);
  openSheet({title:'Troca de horimetro',sub:'Relogio de horas substituido',
  body:`<div class="thm-warn"><b>Atencao: altera o cronograma do equipamento</b>Use so quando o relogio de horas foi trocado. As proximas trocas de cada item sao recalculadas para a contagem do relogio novo.</div>
  <form id="fthm"><div class="fset">
    <label class="f">Equipamento<select id="thm-eq" required data-eqs><option value="">Escolha…</option>${eqs.map(e=>`<option value="${esc(e.id)}"${eqId===e.id?' selected':''}>${esc(e.codigo)} · ${esc(e.tipo)}</option>`).join('')}</select></label>

    <p class="warnline" id="thm-w"></p>

    <label class="f">Data da troca<input id="thm-dt" type="date" required value="${today()}"></label>
    <label class="f">Responsavel<input id="thm-r" placeholder="Mecanico ou oficina"></label>
    <label class="f">Motivo<input id="thm-o" placeholder="Ex.: relogio queimado"></label></div>
    <div class="lbl" id="thm-pl" hidden>Como fica o cronograma</div><div class="spec" id="thm-pv" hidden></div>
    <div id="thm-conf"></div></form>`,
  foot:`<button class="btn pri" form="fthm">Registrar troca</button>`,
  mount:sh=>{const sel=sh.querySelector('#thm-eq'),a=sh.querySelector('#thm-a'),b=sh.querySelector('#thm-b'),w=sh.querySelector('#thm-w'),pv=sh.querySelector('#thm-pv'),pl=sh.querySelector('#thm-pl');
    const fillA=()=>{const e=eqById(sel.value);a.value=e&&e.horimetro!==''&&e.horimetro!=null?e.horimetro:'';a.placeholder=e&&e.horimetro!==''&&e.horimetro!=null?'Minimo '+nf(e.horimetro,2):'';draw()};
    const draw=()=>{const e=eqById(sel.value),A=Number(a.value),B=Number(b.value),ok=e&&a.value!==''&&b.value!=='';
      w.textContent=e&&a.value!==''&&e.horimetro!==''&&e.horimetro!=null&&A<Number(e.horimetro)?`O relogio antigo nao pode ser menor que a ultima leitura (${nf(e.horimetro,2)} h).`:'';
      const its=ok?(e.itens||[]).map(it=>({it,st:itemStatus(e,it)})).filter(x=>x.st.prox!=null):[];
      pl.hidden=pv.hidden=!its.length;
      pv.innerHTML=its.length?`<div class="r" style="display:block"><div class="thm-tb">${its.map(({it,st})=>`<span class="n">${esc(itNome(it))}</span><s class="num">${nf(st.prox)}</s><span class="ar">→</span>${st.prox+(B-A)<=B?'<b class="num" style="color:var(--bad)">vencida</b>':`<b class="num">${nf(st.prox+(B-A))} h</b>`}`).join('')}</div><p class="note" style="margin:8px 0 0">Faltam as mesmas horas para cada troca.</p></div>`:''};
    sel.onchange=fillA;a.oninput=draw;b.oninput=draw;fillA();
    sh.querySelector('#fthm').onsubmit=ev=>{ev.preventDefault();const e=eqById(sel.value);if(!e)return;
      const A=Number(a.value),B=Number(b.value),dt=sh.querySelector('#thm-dt').value||today();
      if(e.horimetro!==''&&e.horimetro!=null&&A<Number(e.horimetro)){a.focus();return}
      if(B<0){toast('A leitura do relogio novo nao pode ser negativa.');return}
      const cf=sh.querySelector('#thm-conf');
      askConfirm(cf,'Continuar',`Registrar a troca do horimetro de <b>${esc(e.codigo)}</b>? O relogio passa de ${nf(A,2)} h para ${nf(B,2)} h e o cronograma e recalculado.`,()=>
      askConfirm(cf,'Confirmar troca',`<b>Confirmacao final.</b> Todos os vencimentos de ${esc(e.codigo)} passam a contar pelo relogio novo.`,async()=>{
        const d=Math.round((B-A)*10)/10,sh_=v=>v===''||v==null||isNaN(Number(v))?v:Math.round((Number(v)+d)*10)/10;

          await S.db.doc('equipamentos/'+e.id).update({horimetro:B,horimetroData:dt,horimetroReg:today(),horimetroPor:(EU()||{}).uid||'',horimetroEm:Date.now(),
            itens:(e.itens||[]).map(i=>({...i,ultimaH:sh_(i.ultimaH),proxH:sh_(i.proxH)})),...(e.combBase&&e.combBase.h!=null?{combBase:{...e.combBase,h:sh_(e.combBase.h)}}:{})})},'Troca de horimetro registrada');
        if(ok){const D=hmDraft();if(D.v&&D.v[e.id]!=null){delete D.v[e.id];hmDraftSave(D)}goBack()}}))}}});
}
/* + › Desfazer troca de horimetro: escolhe a troca e confirma duas vezes.
   So a troca mais recente de cada equipamento pode ser desfeita (as outras dependem dela). */
function openDesfazHm(){
  nav('thmx',()=>openDesfazHm());

  const reg=t=>t.ts||new Date((t.data||today())+'T12:00').getTime(),vivo=t=>Date.now()-reg(t)<=30*864e5,ate=t=>sdate(iso(new Date(reg(t)+30*864e5)));

  body:lst.length?`<div class="ilist">${lst.map(t=>{const e=eqById(t.equipId),ok=latest.has(t.id);return `<div class="ia"><button type="button" class="ia-h" data-ia aria-expanded="false"><span class="ia-t"><b class="num">${esc(e.codigo)}</b> · ${fdate(t.data)}</span><span class="hh-hm num">${nf(t.antigo,2)} → ${nf(t.horimetro,2)} h</span>${I.chev}</button>

  mount:sh=>sh.querySelectorAll('[data-ux]').forEach(b=>b.onclick=()=>{const t=S.trocas.find(x=>x.id===b.dataset.ux),e=t&&eqById(t.equipId);if(!e)return;const cf=sh.querySelector(`[data-uxc="${CSS.escape(t.id)}"]`);

    askConfirm(cf,'Desfazer troca',`<b>Confirmacao final.</b> O horimetro e todos os vencimentos de ${esc(e.codigo)} voltam para a contagem do relogio antigo.`,async()=>{

function cartaoDados(t){
  /* Horimetro: como foi lido no dia. Proxima: SEMPRE no relogio que esta hoje no equipamento (o que o mecanico vai ler).

  let pS=t.proximaH!==''&&t.proximaH!=null?Number(t.proximaH):null;

  const dA=e.id?hmDeltaApos(e.id,t.data):0,dIn=Math.round((hS-h0)*10)/10,dNow=Math.round((dA-dIn)*10)/10;
  const prox=pS!=null?Math.round((pS+dNow)*10)/10:null,iv=t.intervalo||(pS!=null?Math.round((pS-hS)*10)/10:null);
  const cur=Number(e.horimetro)||0,last=!S.trocas.some(x=>x.equipId===t.equipId&&x.tipo===t.tipo&&(x.data||'')>(t.data||''));
  const trocasHm=e.id?hmTrocas(e.id).filter(x=>(x.data||'')>(t.data||'')).sort((a,b)=>(a.data||'').localeCompare(b.data||'')):[];
  return {e,h:h0,prox,iv,falta:prox!=null&&last?Math.round((prox-cur)*10)/10:null,cur,trocasHm};
}

const CAM_OK=!!(window.__PWA&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);

const rdBtn=(id,txt)=>CAM_OK?`<button type="button" class="btn block rd-row" id="${id}">${RD_IC}${txt||'Ler com a camera'}</button>`:'';
const rdCanon=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1').replace(/S/g,'5').replace(/B/g,'8').replace(/Z/g,'2');

function rdKeys(){return S.estoque.map(s=>({s,keys:[s.alm,s.codigo,s.ref,...(s.eans||[])].filter(Boolean).map(rdCanon).filter(k=>k.length>=4)}))}
function rdFind1(txt){const t=rdCanon(txt);if(t.length<4)return {lista:[],aprox:false};const its=rdKeys();
  const ex=its.filter(x=>x.keys.some(k=>t.includes(k)||(k.includes(t)&&t.length>=6)));if(ex.length)return {lista:ex.map(x=>x.s),aprox:false};

function rdFind(txt){const ps=String(txt).split(/[|;\n]/).map(x=>x.trim()).filter(Boolean);

/* referencia de peca dentro do que foi lido (ex.: CAT 222-9021, ou "2229021.000" dentro do QR) */
function rdRef(txt){const t=String(txt);let m=t.match(/\b(\d{3})-?(\d{4})\b/);if(m)return m[1]+'-'+m[2];

  const tk=t.toUpperCase().split(/[\s|;]+/).map(x=>x.replace(/[^A-Z0-9.\-\/]/g,'')).filter(x=>x.length>=4&&/\d/.test(x)&&!/^\d{8,}$/.test(x));return tk[0]||''}

async function rdStart(){const r=RD,v=r.el.querySelector('video'),st=r.el.querySelector('.rdr-st');

/* AJUSTE AUTOMATICO DE CAIXAS (vale para todo o app): numero ou texto que nao cabe na caixa de tamanho fixo
   1) se cabe, nada muda; 2) se nao cabe, a fonte reduz (ate 72%) e a caixa fica igual; 3) so se ainda nao couber, a caixa alarga o minimo necessario.
   Nunca corta nem troca por reticencias. */
const FIT_SEL='.es-b,.dday,.lt-c,.ef-sum>div,.ct-b';
/* conteudo centralizado pode vazar para os dois lados (o scrollWidth nao ve o lado esquerdo): compara as caixas de cada parte */
const fitOver=el=>{if(el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1)return true;const c=el.getBoundingClientRect(),pd=2;
  return [...el.querySelectorAll('*')].some(x=>{if(x instanceof SVGElement)return false;const r=x.getBoundingClientRect();return r.width>0&&(r.left<c.left+pd||r.right>c.right-pd)})};
function fitBox(el){const els=[el,...el.querySelectorAll('*')].filter(x=>!(x instanceof SVGElement));
  const base=els.map(x=>parseFloat(getComputedStyle(x).fontSize)||14);el.dataset.fit='1';
  for(const k of [.92,.85,.78,.72]){els.forEach((x,i)=>{x.style.fontSize=(base[i]*k).toFixed(1)+'px'});if(!fitOver(el))return}
  const w=el.getBoundingClientRect().width;el.style.minWidth=Math.ceil(w)+'px';el.style.width='auto';el.style.flex='0 0 auto';el.style.paddingLeft=el.style.paddingRight='6px';el.style.textOverflow='clip';el.style.overflow='visible'}

new MutationObserver(()=>{if(!fitT)fitT=requestAnimationFrame(fitAll)}).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['hidden','aria-expanded','class']});
addEventListener('resize',()=>{document.querySelectorAll('[data-fit]').forEach(x=>{delete x.dataset.fit;['fontSize','minWidth','width','flex','paddingLeft','paddingRight','textOverflow','overflow'].forEach(p=>x.style[p]='');x.querySelectorAll('*').forEach(c=>{if(!(c instanceof SVGElement))c.style.fontSize=''})});if(!fitT)fitT=requestAnimationFrame(fitAll)});
