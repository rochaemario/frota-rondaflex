<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Frota">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>TESTE · Controle de Frota</title>
<meta name="theme-color" content="#0b2470">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: celular primeiro — cabecalho fino no topo, cartoes empilhados, barra de navegacao no polegar, formularios em gaveta de tela cheia */
:root{
  --bg:#edf0f5; --surface:#ffffff; --sunk:#f3f5f9; --line:#dfe4ec; --line-2:#c9d1de;
  --fg:#121a2c; --muted:#4f5a70; --faint:#677289;
  --ink:#0b2470; --ink-fg:#ffffff; --ink-muted:#a9b8e6; --ink-acc:#9cbcff; --brand-red:#e30613;
  --accent:#0033a0; --accent-tx:#0033a0; --accent-ink:#ffffff; --accent-soft:#e2e9f8;
  --st-bg:#e9eef6; --st-fg:#24427a; --ok:#1b6638; --ok-bg:#e2f1e7; --warn:#8a4b00; --warn-bg:#fbeed6; --bad:#a3271c; --bad-bg:#f8e1dd;
  --shadow:0 1px 2px rgba(11,36,112,.06),0 4px 14px rgba(11,36,112,.06);
  --sit-ok:#1d7440; --sit-warn:#b85a06; --sit-bad:#b02b20;
  --c1:#0033a0; --c2:#2f7d6b; --c3:#d99a1e; --c4:#9a6b9e; --c5:#b5a27a; --c0:#cfd4ce;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --navh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f1a; --surface:#141a28; --sunk:#0f1422; --line:#232b3d; --line-2:#30394d;
  --fg:#e6eaf3; --muted:#a2abbe; --faint:#858fa4;
  --ink:#0e2263; --ink-fg:#f0f4fd; --ink-muted:#93a4d6; --ink-acc:#9cbcff; --brand-red:#ff2b36;
  --accent:#3566e0; --accent-tx:#9cbcff; --accent-ink:#ffffff; --accent-soft:#18265a;
  --st-bg:#18202b; --st-fg:#9db8ea; --ok:#5cc184; --ok-bg:#16291e; --warn:#f0a83a; --warn-bg:#33260f; --bad:#f07565; --bad-bg:#371c18;
  --shadow:0 1px 2px rgba(0,0,0,.3); --c1:#5b86f0; --c2:#4fb39b; --c3:#e0a83a; --c4:#c193c5; --c5:#a8977a; --c0:#36403a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f1a; --surface:#141a28; --sunk:#0f1422; --line:#232b3d; --line-2:#30394d;
  --fg:#e6eaf3; --muted:#a2abbe; --faint:#858fa4;
  --ink:#0e2263; --ink-fg:#f0f4fd; --ink-muted:#93a4d6; --ink-acc:#9cbcff; --brand-red:#ff2b36;
  --accent:#3566e0; --accent-tx:#9cbcff; --accent-ink:#ffffff; --accent-soft:#18265a;
  --st-bg:#18202b; --st-fg:#9db8ea; --ok:#5cc184; --ok-bg:#16291e; --warn:#f0a83a; --warn-bg:#33260f; --bad:#f07565; --bad-bg:#371c18;
  --shadow:0 1px 2px rgba(0,0,0,.3); --c1:#5b86f0; --c2:#4fb39b; --c3:#e0a83a; --c4:#c193c5; --c5:#a8977a; --c0:#36403a; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
/* a rolagem acontece num conteiner proprio, sem barra de rolagem visivel */
html,body{height:100%;overflow:hidden;margin:0}
#scroller{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
#scroller::-webkit-scrollbar{display:none;width:0;height:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* cabecalho */
header{cursor:pointer;-webkit-user-select:none;user-select:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--ink);color:var(--ink-fg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:10px;line-height:1}
.brand i{width:10px;height:20px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--brand-red) 0 4px,#fff 4px 8px)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-muted)}
.sync.on::before{background:#4fd18a;box-shadow:0 0 0 3px rgba(79,209,138,.18)}
.sync.off::before{background:#f07565}

main{display:flex;flex-direction:column;gap:14px;padding-block:14px calc(100px + env(safe-area-inset-bottom,0px))}

/* cartoes */
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px 14px;min-width:0;scroll-margin-top:calc(60px + env(safe-area-inset-top,0px))}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ch h2{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1.05;text-wrap:balance;display:flex;align-items:center;gap:9px}
.ch h2 svg{width:22px;height:22px;color:var(--accent);flex:0 0 auto}
.ch .sub{font-size:13px;color:var(--muted);margin-top:3px}
.lbl{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl:first-child{margin-top:0}
.lbl .c{font-family:var(--mono);letter-spacing:0}

/* botoes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;font-weight:600;font-size:15px;border-radius:12px;padding:0 16px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.out{background:var(--surface);border:1.5px solid var(--accent);color:var(--accent-tx)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}
.btn.ghost{border-color:transparent;background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:transparent;background:var(--bad-bg)}
.btn.sm{min-height:36px;font-size:14px;padding:0 12px;border-radius:10px}
.btn.icon{width:40px;min-height:40px;padding:0;border-radius:12px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* indicadores */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--sunk);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted);line-height:1.3}
.kpi.bad{background:var(--bad-bg)} .kpi.bad b{color:var(--bad)}
.kpi.warn{background:var(--warn-bg)} .kpi.warn b{color:var(--warn)}

/* listas */
.list{display:flex;flex-direction:column;background:var(--sunk);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 13px;min-height:60px;width:100%;text-align:left;background:none;border:0;cursor:pointer;position:relative}
.row+.row{box-shadow:inset 0 1px 0 var(--line)}
button.row:active{background:var(--line)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.row .end{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.chev{width:16px;height:16px;color:var(--faint);flex:0 0 auto}
.stripe{position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0}
.stripe.bad{background:var(--bad)} .stripe.warn{background:var(--warn)}
.code{font-family:var(--mono);font-weight:600;font-size:12.5px;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;white-space:nowrap;letter-spacing:.01em}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.mut{background:var(--surface);color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hm{display:inline-flex;align-items:baseline;gap:3px;font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;background:var(--ink);color:var(--ink-fg);border-radius:7px;padding:3px 8px;letter-spacing:.03em;white-space:nowrap;font-size:14px}
.hm small{color:var(--ink-acc);font-size:10px}
.hm.lg{font-size:24px;padding:6px 12px;border-radius:10px}
.hm.lg small{font-size:12px}
.qty{font-family:var(--mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.qty small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-left:3px}
.more{display:flex;justify-content:center;padding-top:10px}

/* filtros */
.search{position:relative;margin-bottom:8px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
.search input{padding-left:38px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 12px;padding:0 14px}
.chips::-webkit-scrollbar{display:none}
/* sem indicador de rolagem em nenhuma area do app */
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0;background:transparent}
.chip{flex:0 0 auto;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ink-fg)}

/* campos */
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px;width:100%;min-width:0;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date]{padding-block:10px}
textarea{padding:11px 12px;min-height:80px;resize:vertical}
textarea.ag{min-height:46px;resize:none;overflow:hidden;line-height:1.35}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.f:has(>.hint){display:grid;grid-template-columns:auto 1fr;column-gap:6px;align-items:baseline}
.f:has(>.hint)>:not(.hint){grid-column:1/-1}
.f .hint{font-weight:400;font-size:12px;color:var(--faint)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid>.w{grid-column:1/-1}
.fset{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.fset+.fset{margin-top:12px}
.fset>h3{margin:0;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;border:0;border-radius:9px;background:none;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* vazio */
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--sunk);border-radius:14px}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:3px}
.hero{background:var(--ink);color:var(--ink-fg);border-radius:16px;padding:22px 18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,transparent 8px 16px);opacity:.18;border-radius:50%}
.hero h3{font-family:var(--display);font-size:26px;text-transform:uppercase;margin:0 0 8px;line-height:1.05;position:relative}
.hero p{margin:0 0 16px;color:var(--ink-muted);font-size:14.5px;max-width:46ch;position:relative}
.hero .acts{display:flex;flex-direction:column;gap:8px;position:relative}
.hero .btn.ghost{background:rgba(255,255,255,.08);color:var(--ink-fg)}

/* barra de exemplos */
.banner{background:var(--accent-soft);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:13.5px}
.banner b{display:block;font-size:14px}

/* medidor */
.meter{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}

/* situacao */
.sit{display:inline-block;min-width:92px;text-align:center;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.sit.mut{background:var(--sunk);color:var(--muted)} .sit.ok{background:var(--sit-ok)} .sit.warn{background:var(--sit-warn)} .sit.bad{background:var(--sit-bad)}
.ti-g{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 14px 6px}
.ti-more{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 14px;background:none;border:0;border-top:1px solid var(--line);color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.ti-more svg{width:16px;height:16px;transition:transform .2s}.ti-more[aria-expanded=true] svg{transform:rotate(90deg)}
.ti-ok>.chk:first-child{box-shadow:inset 0 1px 0 var(--line)}
.sit-l{display:block!important;padding:4px 0 10px!important}.sit-l .es-l{background:var(--sunk);border-radius:12px}.sit-e .sl li>b.sit-bad{color:#d6002e}.sit-e .sl li>b.sit-warn{color:#8a6400}
.sit-m{font-size:12px;color:var(--muted);font-weight:400;margin-top:6px;line-height:1.4}

/* leitura rapida */
body.focus .sidetabs{display:none!important}
.sidetabs{position:fixed;z-index:8;right:0;top:calc(22% + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:22px;padding-right:env(safe-area-inset-right,0px)}
.stab{display:flex;flex-direction:column;align-items:center;gap:9px;width:26px;padding:12px 0;border-radius:12px 0 0 12px;cursor:pointer;font:inherit}
.stab .sl{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:13.5px;letter-spacing:.03em;line-height:1}
.stab.dark{background:var(--ink);color:var(--ink-fg);border:0;box-shadow:-3px 4px 12px rgba(10,21,16,.22);padding:12px 0 10px}
.stab.dark .sa{width:14px;height:14px;color:var(--ink-fg)}
.stab.lite{background:var(--surface);color:var(--muted);border:1px solid var(--line-2);border-right:0;box-shadow:-2px 3px 10px rgba(10,21,16,.08)}
.stab.lite .dot{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
/* modo ajuste ligado: amarelo bem visivel, igual nos dois temas */
.stab.lite.on{background:#ffc21a;border-color:#e0a400;color:#2b1c00;box-shadow:-3px 4px 14px rgba(255,194,26,.45)}
/* modo ajuste ligado: cabecalho e barra de status no mesmo amarelo do botao Ajustes */
body.aj-on header{--ink:#ffc21a;--ink-fg:#2b1c00;--ink-muted:#5a4200;--ink-acc:#7a5600}
body.aj-on::before{background:#ffc21a}
body.aj-on .sync.on::before{background:#1d7440;box-shadow:0 0 0 3px rgba(29,116,64,.2)}
.stab.lite.on .dot{background:#2b1c00;box-shadow:0 0 0 3px rgba(43,28,0,.2)}
.aj-b{margin-bottom:12px;border:1.5px solid #e0a400;background:#fff4cc;color:#2b1c00}
.aj-b b{color:#2b1c00}
.aj-b .btn{flex:none;background:#2b1c00;border-color:#2b1c00;color:#ffc21a}
.toast.aj{background:#ffc21a;color:#2b1c00;border:1px solid #e0a400;box-shadow:0 6px 20px rgba(255,194,26,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .aj-b{background:#3a2e08;color:#ffe9a8}:root:not([data-theme=light]) .aj-b b{color:#ffd24d}}
:root[data-theme=dark] .aj-b{background:#3a2e08;color:#ffe9a8}:root[data-theme=dark] .aj-b b{color:#ffd24d}
.stab .sh-n{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:2px 3px;line-height:1.2;writing-mode:vertical-rl;transform:rotate(180deg)}
.stab .sh-n{background:#fff;color:var(--ink)}.stab .sh-n.zero{background:#c62828;color:#fff}.stab .sh-n.all{background:#1b7a3a;color:#fff}
.stab:active{transform:scale(.96)}
.quick{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 14px;border-radius:18px;border:0;background:var(--ink);color:var(--ink-fg);cursor:pointer;text-align:left;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.quick .qi{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:0 0 auto}
.quick .qi svg{width:24px;height:24px;color:var(--ink-acc)}
.quick .qt{flex:1;min-width:0}
.quick .qt b{display:block;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.quick .qt span{font-size:13px;color:var(--ink-muted)}
.quick .chev{color:var(--ink-muted)}
.quick .qbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08)}
.quick .qbar i{display:block;height:100%;background:var(--accent)}
.quick:active{transform:scale(.99)}
.lr-top{margin-bottom:10px}
.lr-dt{max-width:220px}
/* faixa de dias da leitura: desliza para os lados, hoje no fim, calendario no icone */
.dstrip-l{font-size:13px;font-weight:600;color:var(--muted);margin:0 2px 6px;display:flex;justify-content:space-between;gap:8px}
.dstrip-l b{color:var(--fg)}
.dstrip-w{display:flex;align-items:center;gap:8px}
.dstrip{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px}
.dday{flex:0 0 50px;scroll-snap-align:end;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 5px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font:inherit;color:var(--fg)}
.dday small{font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.dday b{font-family:var(--mono);font-size:18px;font-weight:600;line-height:1.1}
.dday i{width:5px;height:5px;border-radius:50%;background:transparent}
.dday i.on{background:var(--brand-red)}
.dday[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dday[aria-pressed="true"] small{color:var(--accent-ink)}
.dday[aria-pressed="true"] i.on{background:#fff}

.steps span.on{color:var(--fg);border-color:var(--accent)}

/* botao + */
.fab{position:fixed;z-index:8;right:max(18px,calc(env(safe-area-inset-right,0px) + 14px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 22px rgba(10,21,16,.32),0 2px 6px rgba(10,21,16,.2)}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.94)}
.menu{display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;gap:13px;width:100%;min-height:68px;padding:10px 14px;border-radius:16px;border:0;background:var(--surface);cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.mi:active{transform:scale(.99)}
.mi .ic{width:44px;height:44px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;flex:0 0 auto}
.mi .ic svg{width:22px;height:22px;color:var(--accent)}
.mi .tx{flex:1;min-width:0}
.mi .tx b{display:block;font-size:15.5px;font-weight:600}
.mi .tx span{font-size:13px;color:var(--muted)}
.mgrp{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 2px 0}
.mgrp:first-child{margin-top:0}
.lst-add{display:flex;gap:8px}
.lst-add input{flex:1}
.lst-item+.lst-item{box-shadow:inset 0 1px 0 var(--line)}
.lst-row{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:0 14px;background:none;border:0;cursor:pointer;text-align:left}
.lst-row .chev{transition:transform .2s ease}
.lst-row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.lst-row[aria-expanded="true"]{background:var(--line)}
.lst-act{display:flex;justify-content:flex-end;padding:8px 14px 12px}
.lst-conf .confirm{margin:0 10px 10px}
.ren{margin:0 10px 10px;padding:12px;border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.ren .b{display:flex;gap:8px}.ren .b .btn{flex:1}
.lst-row span{flex:1;font-weight:500}
.lst-row:disabled{cursor:default;color:inherit}
.lst-row:disabled .chev{display:none}
.lst-row em{font-style:normal;font-size:12px;color:var(--muted);font-family:var(--mono)}

/* equipamentos por tipo */
.tsec-wrap{display:flex;flex-direction:column;gap:18px}
.tsec-h{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:2;margin:0 0 8px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--ink);color:var(--ink-fg);font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.tsec-h{min-height:50px;border-radius:14px}
.tsec-h::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--accent)}
.tsec-h span{flex:1}
.tsec-h em{font-style:normal;font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:0;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:3px 9px}
.tsec-l{display:flex;flex-direction:column;background:var(--sunk);border-radius:14px;overflow:hidden}
/* motorista discreto sob a descricao (a descricao continua centralizada na linha) */
.tq.wm,body.focus .tq.wm{min-height:56px}.tq.wm .tq-m{display:flex;flex-direction:column;justify-content:center;gap:2px}.tq-mt{display:block;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tq .mo{display:block;font-size:10.5px;line-height:1.15;color:var(--accent-tx,var(--accent));opacity:.75;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.al-b{display:flex;flex-direction:column;gap:8px}
.al-o{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:0 14px;border:0;border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:var(--fg);box-shadow:var(--shadow)}
.al-o span{font-size:14px;font-weight:600;min-width:84px}.al-o b{flex:1;min-width:0;text-align:right;font-weight:500;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.al-o b.al-v0{color:var(--accent-tx,var(--accent));font-weight:600}
.ral-seg{grid-template-columns:repeat(auto-fit,minmax(80px,1fr))}.ral-seg.fr{grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}.ral-seg button{white-space:nowrap;padding:0 10px;font-size:14.5px}
.tq{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 13px;background:none;border:0;cursor:pointer;text-align:left;width:100%}
.tq+.tq{box-shadow:inset 0 1px 0 var(--line)}
.tq:active{background:var(--line)}
.tq-c{font-family:var(--mono);font-weight:600;font-size:15px;min-width:62px;letter-spacing:.02em}
.tq-x{flex:1;min-width:0;display:flex;flex-direction:column;padding-block:9px}
.tq-x b{font-weight:600;font-size:15.5px}
.tq-x span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tq-n{font-family:var(--mono);font-weight:600;font-size:13px;background:var(--surface);border-radius:999px;padding:2px 9px}
.finder{position:relative;margin-bottom:4px}
.finder .search{margin-bottom:0}
.fres{margin-top:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;overflow:hidden;box-shadow:0 10px 28px rgba(10,21,16,.18);max-height:min(60vh,420px);overflow-y:auto}
.aloc2 .seg{margin-bottom:12px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio-b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:86px;padding:10px 6px;border-radius:14px;border:0;background:var(--sunk);cursor:pointer;min-width:0}
.trio-b .tn{font-family:var(--mono);font-weight:600;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.trio-b .tl{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.trio-b.res{background:transparent;border:1.5px dashed var(--line-2)}
.trio-b:active{background:var(--line)}
.tag-res{margin-right:2px}
.ar-h.res{margin-top:22px}
.ar-h{display:flex;align-items:center;gap:8px;margin:16px 2px 2px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
.dm-body>.ar-h:first-child{margin-top:4px}
.ar-h em{font-style:normal;font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:0;background:var(--sunk);border-radius:999px;padding:2px 9px}
.ar-h::after{content:"";flex:1;height:2px;background:var(--line)}
.aloc2{display:flex;flex-direction:column;gap:12px}
.aloc2 .lr-t{margin:12px 2px 6px}
.lr-t+.tsec-l,.lr-t+.list{margin-top:6px}
.tsec-h.tg{position:static;margin:16px 0 8px}
.kc{display:grid;grid-template-columns:1fr 74px 30px 40px;gap:8px;align-items:center}
.kc+.kc{margin-top:8px}
.kc input{text-align:right;padding:0 8px}
.kc .u{font-size:12px;color:var(--muted)}
.kc .btn{min-height:40px;padding:0;width:40px}
.kc-row .need{font-family:var(--mono);font-weight:600;white-space:nowrap}
.tsec-h.tg:first-child,.seg+.dm-body>.tsec-h.tg:first-child{margin-top:4px}
.lr-t:first-child{margin-top:2px}
.tq-m{flex:1;min-width:0;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* alocacao */
.aloc{display:flex;flex-direction:column;gap:18px;padding-top:14px}
.dist{display:flex;flex-direction:column;gap:10px}
.dist-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dist .big{font-family:var(--mono);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.dist .of{font-family:var(--mono);font-size:15px;color:var(--muted);margin-left:4px}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.bar i{display:block;min-width:4px}
.bar i:first-child{border-radius:6px 0 0 6px}.bar i:last-child{border-radius:0 6px 6px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend b{width:9px;height:9px;border-radius:3px;display:inline-block}
.legend em{font-style:normal;font-family:var(--mono);color:var(--fg);font-weight:600}
.site{display:flex;flex-direction:column;gap:10px}
.site-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.site-n{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.site-c{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:13px 13px 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-width:0;overflow:hidden;transition:border-color .15s,background .15s}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.tile .tl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .tn{font-family:var(--mono);font-weight:600;font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .tf{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile.big{padding:15px 14px 13px}
.tile .tbn{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.03em;line-height:1;margin-top:2px}
.tile.big .tn{font-size:18px;margin-top:6px}
.tile .tn small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.tile:disabled{opacity:.55;cursor:default}
.tile.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 9%,var(--surface))}
.tile.on .tl{color:var(--fg)}
.sel{border-radius:18px;background:var(--sunk);padding:14px 12px 6px}
.sel-h{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;background:none;border:0;cursor:pointer;text-align:left;padding:0 2px 6px}
.sel-h .st{flex:1;font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.sel-h .sem-n{background:var(--surface)}
.sel-h .chev{transform:rotate(90deg)}
.dotc{width:10px;height:10px;border-radius:50%;background:var(--tc);box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 22%,transparent)}
.fr{padding-block:8px}
.fr-h{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:0 4px 7px}
.fr-h em{font-style:normal;font-family:var(--mono);letter-spacing:0;background:var(--surface);border-radius:999px;padding:1px 8px;font-size:11.5px}
.fr-h::after{content:"";flex:1;height:1px;background:var(--line)}
.eqr{display:flex;align-items:center;gap:11px;width:100%;min-height:56px;padding:9px 12px;background:var(--surface);border:0;border-radius:12px;cursor:pointer;text-align:left}
.eqr+.eqr{margin-top:6px}
.eqr:active{transform:scale(.99)}
.eqr .code{min-width:58px;text-align:center}
.eqr .eqm{flex:1;min-width:0;display:flex;flex-direction:column}
.eqr .eqm b{font-weight:600;font-size:14.5px}
.eqr .eqm span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sem{border:1.5px dashed var(--line-2);border-radius:16px}
.sem-h{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:0 14px;background:none;border:0;cursor:pointer;text-align:left}
.sem-t{flex:1;font-weight:600}
.sem-n{font-family:var(--mono);font-weight:600;font-size:13px;background:var(--sunk);border-radius:999px;padding:2px 10px;color:var(--muted)}
.sem .chev{transition:transform .2s ease}
.sem.open .chev{transform:rotate(90deg)}
.sem-b{padding:0 14px 14px}
.sem-b .note{margin:0 0 10px}
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.tag{min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-family:var(--mono);font-weight:600;font-size:13px;cursor:pointer}
.tag:active{background:var(--line)}

/* painel */
#sec-painel{padding:0 14px 14px;overflow:hidden}
.ph.pnb{margin:0 -14px 2px;padding:12px 14px;color:#fff}
.ph.pnb.bad{background:var(--bad)} .ph.pnb.warn{background:#b86200} .ph.pnb.ok{background:var(--ink)}
.ph.pnb h2 svg{color:#fff;width:21px;height:21px}
.ph.pnb.ok h2 svg{color:var(--ink-acc)}
.pnb-n{font-size:13.5px;font-weight:700;letter-spacing:.01em}
#sec-painel .allok{margin-top:12px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ph h2{margin:0;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:8px}
.ph h2 svg{width:20px;height:20px;color:var(--accent)}
#sec-painel .list{margin-top:12px}
.allok{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:14px;color:var(--muted)}
.allok .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:0 0 auto;box-shadow:0 0 0 4px var(--ok-bg)}

/* cartoes expansiveis */
.acc{padding:0;overflow:hidden}
/* logo fixa no rodape da tela inicial, entre o carrinho e o +; ajusta a largura e a area segura de cada aparelho */
/* na tela inicial a rolagem termina acima da faixa da logo: o conteudo nunca passa por baixo dela */
:root{--brandh:calc(24px + env(safe-area-inset-bottom,0px))}
body:not(.focus) #scroller{bottom:var(--brandh)}
.brandmark{position:fixed;z-index:7;left:0;right:0;bottom:0;height:var(--brandh);padding-bottom:calc(3px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;justify-content:center;background:var(--bg);pointer-events:none;line-height:0}
.brandmark::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:6px;background:linear-gradient(to bottom,transparent,var(--bg))}
.brandmark img{width:min(132px,calc(100vw - 196px));min-width:84px;height:auto;opacity:.72}
body.focus .brandmark{display:none}
.acc-h{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:0 16px;background:none;border:0;cursor:pointer;text-align:left}
.acc-h .ic{width:42px;height:42px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;flex:0 0 auto}
.acc-h .ic svg{width:22px;height:22px;color:var(--accent)}
.acc-h h2{flex:1;margin:0;font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.acc-h .tg{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);flex:0 0 auto;transition:transform .2s ease}
.acc-h .tg svg{width:16px;height:16px;color:var(--muted);transform:rotate(90deg)}
.acc-h[aria-expanded="true"] .tg{transform:rotate(180deg)}
.acc-h:active{background:var(--sunk)}
.acc-b{padding:2px 14px 16px;border-top:1px solid var(--line)}
.subbar{position:sticky;top:var(--hdr,52px);z-index:5;display:flex;align-items:center;gap:10px;margin:0 calc(-1 * max(14px,env(safe-area-inset-left,0px)));padding:6px max(14px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.subbar .homebar{width:34px;height:34px;min-height:34px}
.subbar .homebar svg{width:18px;height:18px}
.subbar h2{flex:0 1 auto;margin:0;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subbar h2 span{color:var(--muted);font-size:15px}
.sb-sub{flex:1 1 0;min-width:0;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
/* card aberto: sem moldura; o conteudo usa a largura toda */
body.focus main{padding-top:0;gap:0}
body.focus .card.acc.open{background:none;box-shadow:none;border-radius:0;padding:0;overflow:visible}
body.focus .card.acc.open>.acc-b{padding:10px 0 0;border:0}
body.focus .aloc2{padding-top:0!important}
body.focus .tb{padding-block:2px 10px}
body.focus .tsec-wrap{gap:12px}
body.focus .tsec-h{padding:7px 12px;margin-bottom:6px;font-size:16px;min-height:44px}
body.focus .tsec-l{background:var(--surface);box-shadow:0 1px 0 var(--line)}
body.focus .tq{min-height:44px}
body.focus .tq+.tq,body.focus .tsec-l>.tq+.tq{box-shadow:inset 0 1px 0 var(--line)}
body.focus .pv-note{margin:0 2px 6px;font-size:12px}
body.focus .list{background:var(--surface)}
body.focus .tsec-h{top:calc(var(--hdr,52px) + var(--subh,47px))}
.tb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 12px}
.tb .sub{font-size:13px;color:var(--muted)}
@media (min-width:600px){.acc{padding:0}.acc-b{padding:2px 20px 20px}.acc-h{padding:0 20px}}
@media (prefers-reduced-motion:reduce){.acc-h .tg{transition:none}}

/* gaveta */
#scrim{position:fixed;inset:var(--hdr,0px) 0 0 0;background:rgba(6,14,10,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--bg);width:100%;max-width:640px;height:calc(100dvh - var(--hdr,0px) - 8px);display:flex;flex-direction:column;border-radius:20px 20px 0 0;overflow:hidden}
.sh-top{flex:0 0 auto;background:var(--bg);padding:6px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 8px}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-tt{flex:1;min-width:0}
.sh-head h2{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sh-head .sub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* titulo e subtitulo das telas sempre em uma linha */
.sh-head h2{flex-wrap:nowrap!important;white-space:nowrap;overflow:hidden;min-width:0}.sh-head h2>*{flex:none}.sh-head h2>.tt-x{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sh-nav{display:flex;margin:-2px 0 8px}
.backbtn,.homebar,.alocback{display:inline-grid;place-items:center;flex:0 0 auto;align-self:flex-start;width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);cursor:pointer;box-shadow:none}
.backbtn svg,.homebar svg,.alocback svg{width:20px;height:20px;color:var(--fg)}
.backbtn:active,.homebar:active,.alocback:active{background:var(--sunk)}
.x{width:38px;height:38px;border-radius:50%;border:0;background:var(--sunk);color:var(--muted);font-size:22px;line-height:1;cursor:pointer;flex:0 0 auto}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px max(14px,env(safe-area-inset-right,0px)) 18px max(14px,env(safe-area-inset-left,0px))}
.sh-foot{flex:0 0 auto;display:flex;gap:8px;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}

function applyCfg(c){c=c||{};DONOS=c.donos||CFG_DEF.donos;LOCAIS=c.locais||CFG_DEF.locais;AREAS=c.areas||CFG_DEF.areas;FRENTES=c.frentes||CFG_DEF.frentes;TIPOS=c.tipos||CFG_DEF.tipos;CATS=c.cats||CFG_DEF.cats;if(!CATS.includes('Aditivo'))CATS=[...CATS.slice(0,2),'Aditivo',...CATS.slice(2)];CATUN={...CFG_DEF.catUn,...(c.catUn||{})};ACATS=Array.isArray(c.acats)&&c.acats.length?c.acats:ACAT_DEF;ACATX=Array.isArray(c.acatsX)?c.acatsX:[]}

const TABS=[['painel','Painel'],['frota','Frota'],['equip','Equipamentos'],['aloc','Alocacao'],['manut','Preventivas'],['estoque','Estoque'],['ident','Identificar'],['comb','Combustivel'],['os','Corretiva'],['mnt','Manutencoes'],['far','Filtros de ar']];

/* ---------- regras ---------- */
/* base do equipamento: horimetro da ultima preventiva registrada (no relogio de hoje); sem nenhuma, zero.
   A Proxima gravada na preventiva so vale se a ficha nao tiver intervalo. */
const _eb={t:null,m:{}};
function eqBase(e){if(_eb.t!==S.trocas){_eb.t=S.trocas;_eb.m={}}if(_eb.m[e.id]!==undefined)return _eb.m[e.id];
  let t=null;(S.trocas||[]).forEach(x=>{if(x.equipId!==e.id||x.tipo==='reprog'||x.tipo==='hmtroca'||x.tipo==='filtro_ar')return;if(!t||(x.data||'')>(t.data||'')||((x.data||'')===(t.data||'')&&Number(x.horimetro)>Number(t.horimetro)))t=x});
  let r={h:0,prox:null};
  if(t){const d=hmDeltaApos(e.id,t.data),h0=Number(t.horimetro)||0,dIn=t.hmConv!=null?Number(t.hmConv)-h0:0,pS=t.proximaH!==''&&t.proximaH!=null&&!isNaN(Number(t.proximaH))?Number(t.proximaH):null;
    r={h:Math.round((h0+d)*10)/10,prox:pS!=null?Math.round((pS+d-dIn)*10)/10:null}}

/* intervalo que vale para o item: o escolhido para ele naquele equipamento, senao o do equipamento */
const itIv=(eq,it)=>it&&it.ivSel!==''&&it.ivSel!=null&&it.ivSel!=='aval'&&!isNaN(Number(it.ivSel))?Number(it.ivSel):Number((eq||{}).intervaloPrev)||0;
/* preventiva informada mais recente do equipamento (feita antes do app) */
const _inf={};const infUlt=eqId=>{if(_inf.t!==S.trocas){_inf.t=S.trocas;_inf.m={};S.trocas.forEach(t=>{if(t.tipo!=='informada')return;const c=_inf.m[t.equipId];if(!c||(t.data||'')>(c.data||''))_inf.m[t.equipId]=t})}return _inf.m[eqId]||null};
/* ponto de partida do item: a ultima troca dele; preventiva informada mais nova vale para todos os itens */
function itBase(eq,it){const u=it.ultimaH!==''&&it.ultimaH!=null&&!isNaN(Number(it.ultimaH))?Number(it.ultimaH):null,inf=infUlt(eq.id);
  if(inf&&(u==null||(inf.data||'')>(it.ultimaData||'')))return Math.round((Number(inf.horimetro)+hmDeltaApos(eq.id,inf.data))*10)/10;
  return u==null?eqBase(eq).h:u}
/* aditivo: subcategoria no cadastro (estoque ou item do plano). Aditivo de oleo lubrificante vai junto com o oleo do motor */
const AD_SUB=['Oleo lubrificante','Radiador','Diesel'];
const itSk=it=>it&&it.estoqueId&&stById(it.estoqueId);

const adOleo=it=>!!it&&!it.virt&&ehAdit(it)&&itSub(it)==='Oleo lubrificante';
/* oleo e a referencia dele (viscosidade, ex.: 15W40; ou o codigo) */
const _na=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
const ehOleo=it=>!!it&&!ehAdit(it)&&(it.tipo==='oleo'||(itSk(it)||{}).tipo==='oleo');
function oleoRef(it){const k=itSk(it)||{},t=_na([it.desc,it.espec,k.desc,k.ref,k.codigo].join(' '));
  const m=t.match(/\b(\d{1,2})\s*W\s*-?\s*(\d{2,3})\b/);if(m)return m[1]+'W'+m[2];const s=t.match(/\bSAE\s*-?\s*(\d{2,3})\b/);if(s)return 'SAE'+s[1];
  const c=nzCod(k.codigo||k.ref||'');return c?'C:'+c:''}

const oleoMotor=it=>{if(!ehOleo(it))return false;if(/MOTOR/.test(_na(it.desc)))return true;const r=oleoRef(it),m=/^(\d{1,2})W/.exec(r);return !!m&&Number(m[1])<=25};
function itemStatus(eq,it){
  if(it.ivSel==='aval')return {cls:'mut',label:'Sob avaliacao',rest:Infinity,prox:null,pct:0,aval:true};
  /* aditivo do oleo lubrificante: so e aplicado na troca do oleo do motor; nunca vence */
  if(adOleo(it)){const ol=(eq.itens||[]).filter(oleoMotor),ol2=ol.length?ol:(eq.itens||[]).filter(ehOleo);const ud=ol2.reduce((m,i)=>(i.ultimaData||'')>m?i.ultimaData:m,'');
    const ap=!!it.ultimaData&&it.ultimaData>=ud;return {cls:'mut',label:ap?'Aplicado':'Nao aplicado',rest:Infinity,prox:null,pct:0,adit:true,aplic:ap}}
  /* regra: cada item vence pelo proprio intervalo, contado da ultima troca dele.
     Sem intervalo proprio, usa o da ficha. Reprogramacao vale ate a proxima troca. */
  const h=Number(eq.horimetro)||0,iv=itIv(eq,it),mp=it.proxH!==''&&it.proxH!=null&&!isNaN(Number(it.proxH));
  let ult,prox;

  else{ult=itBase(eq,it);prox=it.reprog&&mp?Number(it.proxH):iv?Math.round((ult+iv)*10)/10:mp?Number(it.proxH):null}

  if(prox==null) return {cls:'mut',label:'Sem intervalo',rest:Infinity,prox:null,pct:0};
  const span=Math.max(1,prox-ult), rest=prox-h, pct=Math.max(0,Math.min(1,(h-ult)/span));
  let cls='ok',label=`${nf(rest)} h`;
  if(rest<=0){cls='bad';label=`Vencida ${nf(-rest)} h`}
  else if(rest<=Math.max(50,span*.1)){cls='warn';label=`Faltam ${nf(rest)} h`}
  else label=`Faltam ${nf(rest)} h`;
  return {cls,label,rest,prox,pct,manual};

  if(!eqItens(e).length)return {cls:'mut',label:'Sem plano',mot:[],its:[],est:[]};
  const crit=[],aten=[],its=[],est=[];
  eqItens(e).forEach(it=>{const st=itemStatus(e,it),sk=it.estoqueId&&stById(it.estoqueId);
    if(st.cls==='bad'||st.cls==='warn')its.push({it,st});

/* =====================================================================
   COMBUSTIVEL — consumo por hora trabalhada (L/h)
   Dados por mes, para o app nunca carregar o historico inteiro:
     comb/{AAAA-MM}             resumo do mes: eq[equipId] = {lt litros abastecidos, n abastecimentos, l litros medidos, h horas medidas}
     comb/{AAAA-MM}/abast/{id}  cada abastecimento
   No equipamento: combBase {h,data,pend} = ultimo tanque cheio (base da medicao) e litros parciais acumulados;
                   combUlt {mes,id} = ultimo abastecimento lancado (so ele pode ser excluido).
   Metodo do tanque cheio: L/h = (litros deste tanque + parciais anteriores) ÷ (horimetro − horimetro do tanque cheio anterior).
   Nada e buscado ate o topico ser aberto; cada mes e buscado so quando escolhido.
   ===================================================================== */
const mesKey=d=>(d||today()).slice(0,7);
const MESES=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesNome=m=>{const[y,mm]=m.split('-');return `${MESES[Number(mm)-1]} ${y}`};
const lhTxt=v=>v==null||!isFinite(v)?'—':nf(v,1)+' L/h';
/* veiculo leve: fica "Somente cadastro", mas abastece; o campo do horimetro guarda o km. Relatorios mostram km e km/L */
const eqComb=()=>S.equips.filter(e=>!soCad(e)||ehVL(e));
const lhU=e=>ehVL(e)?'km':'h';
const lhNum=(e,lh)=>lh==null||!isFinite(lh)||!(lh>0)?null:ehVL(e)?1/lh:lh;
const consTxt=(e,lh)=>{const v=lhNum(e,lh);return v==null?'—':nf(v,1)+(ehVL(e)?' km/L':' L/h')};
/* tela do equipamento: cartao do mes atual + linha "Abastecimentos" que so busca a lista ao abrir */
function openCombEq(id,m0){
  const m=m0||mesKey();nav('cbq:'+id,()=>openCombEq(id,m));
  const e=eqById(id)||S.equipsAll.find(z=>z.id===id);if(!e){goBack();return}
  const row=(k,v,u,note)=>`<div class="cb-c"><span class="k">${k}</span><b>${v}</b><span class="u">${u||''}</span>${note?`<em>${note}</em>`:''}</div>`;
  openSheet({title:esc(e.codigo),sub:esc([e.tipo,alocTxt(e)].filter(Boolean).join(' · ')),
  body:`<div class="cb-card"><div class="cb-mh">Combustivel · ${mesNome(m)}</div><div id="cb-card">${row(ehVL(e)?'Consumo':'Consumo por hora','…',ehVL(e)?'km/L':'L/h')}${row('Consumo acumulado','…','L')}${row('Abastecimentos','…','')}</div></div>
    <div class="ilist" style="margin-top:12px"><div class="ia"><button type="button" class="ia-h" data-ia id="cb-ab" aria-expanded="false"><span class="ia-t">Abastecimentos</span>${I.chev}</button><div class="ia-b" hidden id="cb-abl"><div class="s">Carregando…</div></div></div></div>`,
  mount:sh=>{
    S.db.doc('comb/'+m).get().then(d=>{const v=((d.exists&&d.data().eq)||{})[id]||{lt:0,n:0,l:0,h:0},c=sh.querySelector('#cb-card');if(!c||!c.isConnected)return;
      const lh=v.h>0?v.l/v.h:null,vl=ehVL(e),cv=lhNum(e,lh);
      c.innerHTML=row(vl?'Consumo':'Consumo por hora',cv!=null?nf(cv,1):'—',vl?'km/L':'L/h',cv==null?'Aparece a partir do 2º tanque cheio':'').replace(/^<div class="cb-c">(.*)<\/div>$/s,'<button type="button" class="cb-c" id="cb-md">$1</button>')+row('Consumo acumulado',nf(v.lt,1),'L')+row('Abastecimentos',nf(v.n),'');
      c.querySelector('#cb-md').onclick=()=>combMediaPainel(e)}).catch(()=>{});
    let loaded=false;sh.querySelector('#cb-ab').addEventListener('click',()=>{if(loaded)return;loaded=true;
      S.db.collection('comb/'+m+'/abast').where('equipId','==',id).get().then(q=>{const b=sh.querySelector('#cb-abl');if(!b||!b.isConnected)return;
        const l=q.docs.map(d=>d.data()).sort((a,b)=>(b.data||'').localeCompare(a.data||'')||(b.ts||0)-(a.ts||0));
        b.innerHTML=l.length?`<div class="cb-ab"><div class="cb-abh"><span>Data</span><span>Horimetro</span><span>Litros</span></div>${l.map(f=>`<div class="cb-abr"><span>${fdate(f.data)}</span><span>${nf(f.horimetro,2)}<i>${lhU(e)}</i></span><span>${nf(f.litros,2)}<i>L</i></span></div>`).join('')}</div>`:'<div class="s">Nenhum abastecimento neste mes.</div>'}).catch(()=>{const b=sh.querySelector('#cb-abl');if(b)b.innerHTML='<div class="s">Nao foi possivel carregar.</div>'})});
  }});
}

/* painel por cima da tela do equipamento: media acumulada a cada abastecimento (todos os meses, nenhum desconsiderado).
   Media acumulada = litros medidos ÷ horas medidas, somados desde o primeiro abastecimento. Mais recentes primeiro.
   Linha com marca: consumo daquele intervalo muito fora da media de ate entao (continua na conta). */
async function combMediaPainel(e){
  document.querySelectorAll('.mp-ov').forEach(x=>x.remove());
  const host=$('#sheet');if(!host)return;const vl=ehVL(e),un=vl?'km/L':'L/h';
  const ov=document.createElement('div');ov.className='mp-ov';
  ov.innerHTML=`<div class="mp" role="dialog" aria-label="Media de consumo"><div class="mp-g"></div><div class="mp-h"><h3>${esc(e.codigo)} · Consumo</h3><button type="button" class="mp-x" aria-label="Fechar">×</button></div><div class="mp-b"><div class="card-wait" style="min-height:120px">Carregando…</div></div></div>`;
  host.appendChild(ov);const pn=ov.querySelector('.mp'),fechar=()=>ov.remove();
  ov.addEventListener('click',ev=>{if(ev.target===ov)fechar()});ov.querySelector('.mp-x').onclick=fechar;
  /* arrastar para baixo fecha */
  {const hd=ov.querySelector('.mp-h'),gb=ov.querySelector('.mp-g');let y0=null,dy=0;
    const st=ev=>{y0=ev.touches[0].clientY;dy=0;pn.style.transition='none'},mv=ev=>{if(y0==null)return;dy=Math.max(0,ev.touches[0].clientY-y0);pn.style.transform=`translateY(${dy}px)`},
      en=()=>{if(y0==null)return;y0=null;pn.style.transition='';if(dy>80)fechar();else pn.style.transform=''};
    [hd,gb].forEach(x=>{x.addEventListener('touchstart',st,{passive:true});x.addEventListener('touchmove',mv,{passive:true});x.addEventListener('touchend',en)})}
  const b=ov.querySelector('.mp-b');
  try{
    const ms=(await S.db.collection('comb').get()).docs.filter(d=>{const x=d.data();return x&&x.eq&&x.eq[e.id]}).map(d=>d.id).sort();
    const l=[];for(const m of ms){const q=await S.db.collection('comb/'+m+'/abast').where('equipId','==',e.id).get();q.docs.forEach(d=>l.push(d.data()))}
    if(!ov.isConnected)return;
    l.sort((a,c)=>(a.data||'').localeCompare(c.data||'')||(a.ts||0)-(c.ts||0));
    let sL=0,sH=0;const rs=l.map(f=>{const h=Number(f.horas)||0,L=Number(f.litrosMedidos)||0;
      if(h>0&&L>0){const ant=sH>0?sL/sH:null;sL+=L;sH+=h;const lh=L/h;return {d:f.data,v:sL/sH,av:ant!=null&&(lh>ant*1.5||lh<ant*.5)}}
      return {d:f.data,t:f.cheio===false?'parcial':'inicio'}}).reverse();
    const tot=sH>0?lhNum(e,sL/sH):null;
    b.innerHTML=`<div class="mp-t"><span>Media acumulada</span><b>${tot!=null?nf(tot,1)+' '+un:'—'}</b></div>
      <div class="mp-l">${rs.length?`<div class="mp-r hd"><span>Data</span><span>Media</span></div>${rs.map(r=>`<div class="mp-r${r.av?' av':''}"${r.av?' title="Consumo do intervalo fora do normal"':''}><span>${fdate(r.d)}</span><span>${r.t?`<i>${r.t}</i>`:nf(lhNum(e,r.v),1)}</span></div>`).join('')}`:'<div class="empty">Nenhum abastecimento.</div>'}</div>`}
  catch(er){console.error(er);if(ov.isConnected)b.innerHTML='<div class="empty">Nao foi possivel carregar.</div>'}
}
/* ---------- + › Abastecimento ---------- */
function formAbast(){
  nav('ab:new',()=>formAbast());
  const eqs=S.eqCtl.filter(e=>e.status!=='inativo').sort(byCode);
  openSheet({title:'Abastecimento',sub:'Consumo por hora trabalhada',
  body:`<form id="fab-f"><div class="fset">
    <label class="f">Equipamento<select id="ab-eq" required data-eqs><option value="">Escolha…</option>${eqs.map(e=>`<option value="${esc(e.id)}">${esc(e.codigo)} · ${esc(e.tipo||'')}</option>`).join('')}</select></label>
    <p class="note" id="ab-base" style="margin:0"></p>
    <div class="grid"><label class="f">Data<input id="ab-dt" type="date" required value="${today()}"></label>
    <label class="f">Horimetro (h)<input id="ab-hm" type="number" step="0.1" inputmode="decimal" required></label></div>
    <label class="f">Litros<input id="ab-l" type="number" step="0.1" min="0" inputmode="decimal" required></label>
    <div class="f">Completou o tanque?<div class="seg" role="group" aria-label="Completou o tanque"><button type="button" data-ch="1" aria-pressed="true">Sim, tanque cheio</button><button type="button" data-ch="0" aria-pressed="false">Nao, parcial</button></div></div>
    <div class="cb-prev" id="ab-prev" hidden></div>
    <label class="f">Responsavel<input id="ab-r" placeholder="Operador ou frentista"></label>

/* ---------- abastecimento fora de ordem: lancar retroativo, editar ou excluir ----------
   cada tanque cheio mede o consumo desde o anterior: a corrente do equipamento e recalculada inteira */
const abR1=v=>Math.round(v*10)/10;
const abH=r=>Number(r.hmConv!=null?r.hmConv:r.horimetro);
const abOrd=(a,b)=>(a.data||'').localeCompare(b.data||'')||abH(a)-abH(b)||(a.ts||0)-(b.ts||0);
async function abastMeses(){let l=[];try{const q=await S.db.collection('comb').get();l=q.docs.map(d=>d.id).filter(k=>/^\d{4}-\d{2}$/.test(k))}catch(e){}const t=mesKey();if(!l.includes(t))l.push(t);return l.sort()}
async function abastDoEq(eqId){const R=[];for(const m of await abastMeses()){try{const q=await S.db.collection('comb/'+m+'/abast').where('equipId','==',eqId).get();q.docs.forEach(d=>R.push({...d.data(),id:d.id,mes:m}))}catch(e){}}return R.sort(abOrd)}
/* op: {tipo:'add',x:{data,h0,litros,cheio,custo,cb,resp,obs}} | {tipo:'ed',id,x:{data,h0,litros,custo},desfaz} | {tipo:'del',id}
   devolve {erro} sem gravar nada, ou {ok} */
async function abastOp(e,op){
  const c=await cbxCfg();await cbxFechAll();
  const R=await abastDoEq(e.id),base0=R.length?(R[0].antBase||null):(e.combBase||null);
  const L=R.map(r=>({...r}));let alvo=null,velho=null;
  if(op.tipo!=='add'){const i=L.findIndex(r=>r.id===op.id);if(i<0)return {erro:'Abastecimento nao encontrado'};velho=L[i];L.splice(i,1)}
  if(op.tipo==='add'){const x=op.x,dl=hmDeltaApos(e.id,x.data),m=mesKey(x.data);
    alvo={equipId:e.id,data:x.data,horimetro:x.h0,...(dl?{hmConv:abR1(x.h0+dl)}:{}),litros:abR1(x.litros),cheio:x.cheio!==false,tipo:e.tipo||'',alocacao:e.alocacao||'',area:e.area||'',frente:e.frente||'',
      ...(x.custo?{custo:x.custo}:{}),...(x.cb?{comboio:x.cb}:{}),resp:x.resp||'',obs:x.obs||'',ts:Date.now(),id:S.db.collection('comb/'+m+'/abast').doc().id,mes:m,_novo:1}}
  else if(op.tipo==='ed'){const x=op.x,dl=hmDeltaApos(e.id,x.data);alvo={...velho,data:x.data,horimetro:x.h0,litros:abR1(x.litros),mes:mesKey(x.data),_novo:velho.mes!==mesKey(x.data)?1:0};
    delete alvo.hmConv;if(dl)alvo.hmConv=abR1(x.h0+dl);if(x.custo)alvo.custo=x.custo;else delete alvo.custo;
    const h=velho.hist||[];alvo.hist=op.desfaz?h.slice(0,-1):[...h,{data:velho.data,horimetro:velho.horimetro,litros:velho.litros,custo:velho.custo||'',em:Date.now(),por:(EU()||{}).nome||''}];if(!alvo.hist.length)delete alvo.hist}
  if(alvo){if(!(alvo.litros>0))return {erro:'Informe os litros'};if(!(alvo.horimetro>=0)||alvo.horimetro==null||isNaN(alvo.horimetro))return {erro:'Informe o horimetro'};if(alvo.data>today())return {erro:'Data no futuro'};L.push(alvo);L.sort(abOrd)}
  /* periodo fechado */
  const cbF=(alvo||velho).comboio||(c.comboios[0]&&c.comboios[0].id);
  for(const r of [velho,alvo])if(r){const tv=cbxTrava(cbF,r.data);if(tv)return {erro:`Periodo fechado ate ${fdate(tv)}`}}
  /* horimetro entre o anterior e o seguinte do mesmo equipamento */
  if(alvo){const i=L.indexOf(alvo),a=L[i-1],p=L[i+1],h=abH(alvo),u=lhU(e);
    if(a&&abH(a)>=h)return {erro:`O horimetro precisa ser maior que o de ${fdate(a.data)} (${nf(abH(a),1)} ${u})`};
    if(p&&abH(p)<=h)return {erro:`O horimetro precisa ser menor que o de ${fdate(p.data)} (${nf(abH(p),1)} ${u})`}}
  /* saldo do comboio */
  if(cbF){const aj={};if(velho)aj[velho.data]=abR1((aj[velho.data]||0)+Number(velho.litros));if(alvo)aj[alvo.data]=abR1((aj[alvo.data]||0)-alvo.litros);
    const from=Object.keys(aj).sort()[0],rs=from&&Object.values(aj).some(v=>v<0)?await cbxRun(c,cbF,from,aj):null;if(rs&&rs.min<0)return {erro:cbxSemSaldo(rs).replace(/<[^>]+>/g,'')}}
  /* recalcula a corrente */
  let b=base0,ant=null;const eqJ=v=>JSON.stringify(v==null?null:v);
  for(const r of L){const h=abH(r),cheio=r.cheio!==false;let horas=null,lh=null,LM=null,nb;
    if(cheio&&b&&b.h!=null){const hs=abR1(h-b.h);if(hs>0){horas=hs;LM=abR1(Number(r.litros)+(b.pend||0));lh=Math.round(LM/horas*100)/100}nb={h,data:r.data,pend:0}}
    else if(cheio)nb={h,data:r.data,pend:0};else nb=b?{...b,pend:abR1((b.pend||0)+Number(r.litros))}:null;
    const nv={horas,lh,litrosMedidos:horas?LM:null,antBase:b||null,antUlt:ant?{mes:ant.mes,id:ant.id,l:ant.litros}:null,antUltData:ant?ant.data:''};
    r._mud=r===alvo||Object.keys(nv).some(k=>eqJ(r[k])!==eqJ(nv[k]));Object.assign(r,nv);b=nb;ant=r}
  const meses=new Set(),limpo=r=>{const o={...r};['id','mes','_novo','_mud'].forEach(k=>delete o[k]);return o};
  if(velho&&(op.tipo==='del'||alvo.mes!==velho.mes)){await S.db.doc(`comb/${velho.mes}/abast/${velho.id}`).delete();meses.add(velho.mes)}
  for(const r of L)if(r._mud){await S.db.doc(`comb/${r.mes}/abast/${r.id}`).set(limpo(r));meses.add(r.mes)}
  /* resumos do mes: totais do equipamento refeitos; litros por dia, comboio e custo pela diferenca */
  for(const m of meses){const md=S.db.doc('comb/'+m),cur=await md.get(),d=(cur.exists&&cur.data())||{eq:{}};
    const eq={...(d.eq||{})},rs=L.filter(r=>r.mes===m),sm=k=>abR1(rs.reduce((a,r)=>a+(Number(r[k])||0),0));
    if(rs.length)eq[e.id]={lt:sm('litros'),n:rs.length,l:sm('litrosMedidos'),h:sm('horas')};else delete eq[e.id];
    const dia={...(d.dia||{})},cbd={...(d.cbDia||{})},cus={...(d.cus||{})};
    const mov=(r,s)=>{if(!r||r.mes!==m)return;const dk=r.data.slice(8,10),v=s*Number(r.litros),ad=(o,k)=>{o[k]=abR1((Number(o[k])||0)+v);if(o[k]<=0)delete o[k]};
      ad(dia,dk);if(r.comboio){const o={...(cbd[r.comboio]||{})};ad(o,dk);cbd[r.comboio]=o}if(r.custo)ad(cus,r.custo)};
    mov(velho,-1);mov(alvo,1);await md.set({...d,eq,dia,cbDia:cbd,cus})}
  /* equipamento: base de consumo e ultimo abastecimento; horimetro so com informacao mais atual */
  const ul=L[L.length-1],up={combBase:b||null,combUlt:ul?{mes:ul.mes,id:ul.id,l:ul.litros}:null,combUltData:ul?ul.data:''};
  if(alvo){const h=abH(alvo),fonte=velho&&Number(e.horimetro)===abH(velho)&&e.horimetroData===velho.data;
    if((h>(Number(e.horimetro)||0)&&alvo.data>=(e.horimetroData||''))||(fonte&&ul===alvo)){up.horimetro=h;up.horimetroData=alvo.data;up.horimetroReg=today()}}
  await S.db.doc('equipamentos/'+e.id).update(up);Object.assign(e,up);return {ok:1,alvo}}

/* + › Combustivel › Abastecimentos: editar ou excluir (periodo aberto) */
async function openDelAbast(){
  nav('dl:ab',()=>openDelAbast());
  openSheet({title:'Abastecimentos',sub:'Editar ou excluir',body:'<div class="card-wait" style="min-height:120px">Carregando…</div>'});
  const c=await cbxCfg();await cbxFechAll();const cb0=c.comboios[0]&&c.comboios[0].id,F=cb0&&cbxFechUlt(cb0),t=today();
  const de=F?addDia(F.corte,1):(()=>{const[y,mo]=t.slice(0,7).split('-').map(Number);return (mo===1?`${y-1}-12`:`${y}-${String(mo-1).padStart(2,'0')}`)+'-01'})();
  const l=[];for(let m=de.slice(0,7);m<=t.slice(0,7);m=mesSeg(m)){try{const q=await S.db.collection('comb/'+m+'/abast').get();q.docs.forEach(d=>{const x=d.data();if(x.data>=de&&!cbxTrava(x.comboio||cb0,x.data))l.push({...x,id:d.id,mes:m})})}catch(e){}}
  l.sort((a,b)=>(b.data||'').localeCompare(a.data||'')||String((eqById(a.equipId)||{}).codigo||'').localeCompare(String((eqById(b.equipId)||{}).codigo||''),'pt',{numeric:true}));
  if(NAV[NAV.length-1]?.key!=='dl:ab')return;
  const cus=cbxCustosAb(c),item=f=>{const e=eqById(f.equipId),k=esc(f.mes+'/'+f.id);return `<div class="ia" data-ab="${k}" data-tag="${esc(nzCod(e?e.codigo:''))}"><button type="button" class="ia-h" data-ia aria-expanded="false"><span class="tq-c">${esc(e?e.codigo:'—')}</span><span class="ia-t cb-dd">${fdate(f.data)}</span><span class="cb-lt">${nf(f.litros,2)} L</span>${I.chev}</button>
    <div class="ia-b" hidden><div class="spec cb-sp"><div class="r"><span>Horimetro</span><b>${nf(f.horimetro,2)} ${e?lhU(e):'h'}</b></div><div class="r"><span>Litros</span><b>${nf(f.litros,2)} L</b></div><div class="r"><span>Centro de custo</span><b>${esc(f.custo?cbxCuNome(f.custo):'—')}</b></div><div class="r"><span>Consumo</span><b>${e?consTxt(e,f.lh):lhTxt(f.lh)}</b></div>${(f.hist||[]).length?`<div class="r"><span>Editado</span><b>${f.hist.length}x · ${esc(f.hist[f.hist.length-1].por||'')}</b></div>`:''}</div>
    <div class="pn-bt ab-bt"><button type="button" class="btn sm" data-abe>Editar</button>${(f.hist||[]).length?'<button type="button" class="btn sm" data-abu>Desfazer edicao</button>':''}<button type="button" class="btn sm danger" data-abx>Excluir</button></div><div data-abf></div><div data-abc></div></div></div>`};
  openSheet({title:'Abastecimentos',sub:'Editar ou excluir',
  body:`<label class="cbx-q" style="margin-bottom:12px">${CBX_IC.q}<input id="ab-q" type="search" placeholder="Buscar TAG" autocomplete="off" aria-label="Buscar TAG"></label>${l.length?`<div class="ilist" id="ab-l">${l.map(item).join('')}</div><div class="empty" id="ab-0" hidden><b>Nenhuma TAG encontrada</b>Confira o codigo.</div>`:'<div class="empty">Nenhum abastecimento no periodo aberto.</div>'}`,
  mount:sh=>{const q=sh.querySelector('#ab-q');q.addEventListener('input',()=>{const v=nzCod(q.value);let n=0;sh.querySelectorAll('[data-ab]').forEach(x=>{const ok=!v||x.dataset.tag.includes(v);x.hidden=!ok;if(ok)n++});const z=sh.querySelector('#ab-0');if(z)z.hidden=!!n||!l.length});
    const fim=(ok,msg)=>{if(ok){toast(msg);NAV.pop();openDelAbast()}};
    sh.querySelectorAll('[data-ab]').forEach(el=>{const f=l.find(x=>x.mes+'/'+x.id===el.dataset.ab),e=f&&eqById(f.equipId);if(!e)return;const box=el.querySelector('[data-abf]'),cx=el.querySelector('[data-abc]');
      const run=async op=>{let r;const ok=await safe(async()=>{r=await abastOp(e,op)});if(r&&r.erro){cx.innerHTML=cbxMsg('bad',esc(r.erro)+'.');return false}return ok};
      el.querySelector('[data-abx]').onclick=()=>askDelete(cx,`Excluir o abastecimento de ${esc(e.codigo)} de ${fdate(f.data)}? O consumo dos abastecimentos seguintes e recalculado.`,async()=>fim(await run({tipo:'del',id:f.id},'Abastecimento excluido'),'Abastecimento excluido'));
      const u=el.querySelector('[data-abu]');if(u)u.onclick=()=>{const h=f.hist[f.hist.length-1];askConfirm(cx,'Desfazer',`Voltar para ${fdate(h.data)} · ${nf(h.horimetro,2)} ${lhU(e)} · ${nf(h.litros,2)} L${h.custo?' · '+esc(cbxCuNome(h.custo)):''}?`,async()=>fim(await run({tipo:'ed',id:f.id,x:{data:h.data,h0:Number(h.horimetro),litros:Number(h.litros),custo:h.custo||''},desfaz:1},'Edicao desfeita'),'Edicao desfeita'))};
      el.querySelector('[data-abe]').onclick=()=>{if(box.innerHTML){box.innerHTML='';return}cx.innerHTML='';let cu=f.custo||'';
        box.innerHTML=`<div class="fset ab-ed"><div class="grid"><label class="f">Data<input type="date" data-ed="d" value="${esc(f.data)}" max="${today()}"></label><label class="f">${ehVL(e)?'Km':'Horimetro'}<input type="number" inputmode="decimal" step="0.1" data-ed="h" value="${esc(f.horimetro)}"></label></div>
          <label class="f">Litros<input type="number" inputmode="decimal" step="0.1" min="0" data-ed="l" value="${esc(f.litros)}"></label>
          <div class="f">Centro de custo<div class="seg" role="group" aria-label="Centro de custo" style="grid-template-columns:repeat(${cus.length},1fr)">${cus.map(k=>`<button type="button" data-edc="${esc(k.id)}" aria-pressed="${cu===k.id}">${esc(k.nome)}</button>`).join('')}</div></div>
          <div class="pn-bt"><button type="button" class="btn sm" data-edx>Cancelar</button><button type="button" class="btn sm pri" data-eds>Salvar</button></div></div>`;
        box.querySelectorAll('[data-edc]').forEach(b=>b.onclick=()=>{cu=b.dataset.edc;box.querySelectorAll('[data-edc]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
        box.querySelector('[data-edx]').onclick=()=>{box.innerHTML='';cx.innerHTML=''};
        box.querySelector('[data-eds]').onclick=async ev=>{const g=k=>box.querySelector(`[data-ed="${k}"]`).value,d=g('d'),h=g('h'),lt=g('l');
          if(!d||h===''||lt===''){cx.innerHTML=cbxMsg('bad','Preencha data, horimetro e litros.');return}
          if(d===f.data&&Number(h)===Number(f.horimetro)&&Number(lt)===Number(f.litros)&&cu===(f.custo||'')){box.innerHTML='';return}
          ev.target.disabled=true;const ok=await run({tipo:'ed',id:f.id,x:{data:d,h0:Number(h),litros:Number(lt),custo:cu}},'Abastecimento editado');ev.target.disabled=false;fim(ok,'Abastecimento editado')}}})}});
}

/* =====================================================================
   COMBUSTIVEL v2 — Comboio (tanque), abastecer a frota em lote, entrada no tanque, fechar mes, relatorio
   config/comb       {comboios:[{id,nome,cap,corte,off}], custos:[{id,nome,pai,off}]}
   config/combFech   {[comboio]:[{corte,saldo,calc,ts}]}  fechamentos; o ultimo e a base do saldo e trava as datas ate o corte
   comb/{m}          + cbDia{cb:{dd:L}} saidas por comboio, cbEnt{cb:{dd:L}} entradas, cus{custo:L} saidas por custo, cusEnt{custo:L}
   comb/{m}/ent/{id} entrada no tanque {comboio,data,hora,litros,custo,ts}
   Rascunho do lote fica no aparelho (nao se perde ao sair da tela): localStorage cbx.r:{ns}{cb}:{data}
   ===================================================================== */
const CBX_DEF={comboios:[{id:'c01',nome:'Comboio 01',cap:null,corte:null}],custos:[{id:'planta',nome:'Planta'},{id:'mina',nome:'Mina'},{id:'ug',nome:'UG',pai:'mina'}],ugEq:['EH-01','EH-02','MT-01','PC-03','PC-05','RE-02','RE-03']};
const CBX_NS=()=>(window.__frotaNS||'');
/* litros do ultimo abastecimento do equipamento: novos ja vem no combUlt; antigos sao buscados uma vez e ficam no aparelho */
const cbxUltL=e=>{const u=e&&e.combUlt;if(!u||!u.id)return null;if(u.l!=null)return Number(u.l);const v=cbxLS.get('ul:'+u.id);return v==null?null:Number(v)};
async function cbxUltBusca(){if(!navigator.onLine)return [];const f=eqComb().filter(e=>e.combUlt&&e.combUlt.id&&cbxUltL(e)==null);
  const r=await Promise.all(f.map(e=>S.db.doc(`comb/${e.combUlt.mes}/abast/${e.combUlt.id}`).get().then(d=>{const x=d.exists&&d.data();if(x&&x.litros!=null){cbxLS.set('ul:'+e.combUlt.id,Number(x.litros));return e}return null}).catch(()=>null)));
  return r.filter(Boolean)}
const cbxLS={get:k=>{try{return JSON.parse(localStorage.getItem('cbx.'+CBX_NS()+k)||'null')}catch(e){return null}},set:(k,v)=>{try{if(v==null)localStorage.removeItem('cbx.'+CBX_NS()+k);else localStorage.setItem('cbx.'+CBX_NS()+k,JSON.stringify(v))}catch(e){}},
  keys:p=>{const out=[],pre='cbx.'+CBX_NS()+p;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(pre))out.push(k.slice(pre.length))}}catch(e){}return out}};
async function cbxCfg(force){if(S.cbxCfg&&!force)return S.cbxCfg;
  try{const d=await S.db.doc('config/comb').get();const v=d.exists?d.data():{};S.cbxCfg={comboios:(v.comboios&&v.comboios.length?v.comboios:CBX_DEF.comboios),custos:(v.custos&&v.custos.length?v.custos:CBX_DEF.custos),ugEq:(Array.isArray(v.ugEq)?v.ugEq:CBX_DEF.ugEq.slice())}}
  catch(e){S.cbxCfg=S.cbxCfg||JSON.parse(JSON.stringify(CBX_DEF))}return S.cbxCfg}
async function cbxFechAll(){try{const d=await S.db.doc('config/combFech').get();S.cbxFech=d.exists?d.data():{}}catch(e){S.cbxFech=S.cbxFech||{}}return S.cbxFech}
const cbxFechUlt=cb=>{const l=(S.cbxFech||{})[cb]||[];return l.length?l[l.length-1]:null};
const cbxAtivos=c=>c.comboios.filter(x=>!x.off);
const cbxCur=c=>{const l=cbxAtivos(c),k=cbxLS.get('cb');return l.find(x=>x.id===k)||l[0]||c.comboios[0]};
const cbxCustosAb=c=>c.custos.filter(x=>!x.off);
const cbxCustosEnt=c=>c.custos.filter(x=>!x.off&&!x.pai);
const cbxCuNome=id=>{const c=(S.cbxCfg||CBX_DEF).custos.find(x=>x.id===id);return c?c.nome:id||'—'};
const cbxCuCurto=n=>String(n||'').length<=3?String(n).toUpperCase():String(n).charAt(0).toUpperCase();
/* custo padrao do equipamento: sai da alocacao (Planta, Mina ou UG); fora do DM1 nao tem.
   UG so para quem esta na lista de Ajustes › Combustivel; o resto alocado na UG abastece como Mina */
const cbxUgAbast=(e,c)=>!!e&&((c&&c.ugEq)||CBX_DEF.ugEq).some(t=>nzCod(t)===nzCod(e.codigo));
const cbxCuId=(c,nm)=>{const x=cbxCustosAb(c).find(k=>nzCod(k.nome)===nzCod(nm));return x?x.id:''};
function cbxCustoPad(e,c){if(!e||e.alocacao!=='DM1')return '';const nm=e.area==='Mina'&&e.frente==='UG'?(cbxUgAbast(e,c)?'UG':'Mina'):e.area;return cbxCuId(c,nm)}
/* custo de quem vai ser realocado agora: realocar na UG quem nao esta na lista cobra Mina */
function cbxCustoR(e,c,r){if(!r)return cbxCustoPad(e,c);const k=c.custos.find(z=>z.id===r);return k&&k.nome==='UG'&&!cbxUgAbast(e,c)?(cbxCuId(c,'Mina')||r):r}
const cbxNaObra=e=>e&&e.alocacao==='DM1';
const addDia=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return iso(x)};
const fimMes=m=>{const[y,mo]=m.split('-').map(Number);return iso(new Date(y,mo,0,12))};
const mesSeg=m=>{const[y,mo]=m.split('-').map(Number);return mo===12?`${y+1}-01`:`${y}-${String(mo+1).padStart(2,'0')}`};
const corteDe=(m,dia)=>{if(!dia)return fimMes(m);const f=fimMes(m),d=Math.min(Number(dia),Number(f.slice(8,10)));return m+'-'+String(d).padStart(2,'0')};
const cbxMesNome=m=>{const n=MESES[Number(m.slice(5,7))-1];return n.charAt(0).toUpperCase()+n.slice(1)};
/* proximo corte sugerido: o mes depois do ultimo fechamento; sem fechamento, o ultimo corte que ja passou */
function cbxCorteSug(cb){const F=cbxFechUlt(cb.id);if(F)return corteDe(mesSeg(F.corte.slice(0,7)),cb.corte);
  const t=today(),m=t.slice(0,7),c=corteDe(m,cb.corte);if(c<=t)return c;const[y,mo]=m.split('-').map(Number);return corteDe(mo===1?`${y-1}-12`:`${y}-${String(mo-1).padStart(2,'0')}`,cb.corte)}
const cbxTrava=(cb,dt)=>{const F=cbxFechUlt(cb);return F&&dt<=F.corte?F.corte:''};
/* saidas por dia de um comboio no resumo do mes; lancamentos antigos (sem comboio) contam no primeiro comboio */
function cbxSaiDia(d,cb,first){const own=((d.cbDia||{})[cb])||{};if(!first)return own;const r={...own};
  Object.entries(d.dia||{}).forEach(([dk,v])=>{let s=0;Object.values(d.cbDia||{}).forEach(o=>s+=Number(o[dk])||0);const leg=Math.round(((Number(v)||0)-s)*10)/10;if(leg>0)r[dk]=Math.round(((Number(r[dk])||0)+leg)*10)/10});return r}
/* soma entradas e saidas de um comboio entre duas datas (inclusive) */
async function cbxSomas(c,cb,de,ate){let ent=0,sai=0;const first=c.comboios[0]&&c.comboios[0].id===cb;
  for(let m=de.slice(0,7);m<=ate.slice(0,7);m=mesSeg(m)){let d={};try{const x=await S.db.doc('comb/'+m).get();d=x.exists?x.data():{}}catch(e){}
    const inR=dk=>{const dt=m+'-'+dk;return dt>=de&&dt<=ate};
    Object.entries(((d.cbEnt||{})[cb])||{}).forEach(([dk,v])=>{if(inR(dk))ent+=Number(v)||0});
    Object.entries(cbxSaiDia(d,cb,first)).forEach(([dk,v])=>{if(inR(dk))sai+=Number(v)||0})}
  return {ent:Math.round(ent*10)/10,sai:Math.round(sai*10)/10}}
async function cbxTanque(c,cb){const F=cbxFechUlt(cb.id),t=today(),de=F?addDia(F.corte,1):t.slice(0,7)+'-01';
  const s=await cbxSomas(c,cb.id,de,t>de?t:de);
  /* sem saldo informado (nenhum fechamento): entrada considerada igual a saida */
  if(!F)return {...s,entReal:s.ent,ent:s.sai,est:true,de,base:null,F,saldo:null};
  return {...s,de,base:Number(F.saldo),F,saldo:Math.round((Number(F.saldo)+s.ent-s.sai)*10)/10}}
/* entradas e saidas por dia de um comboio entre duas datas: {aaaa-mm-dd:{e,s}} */
async function cbxDias(c,cb,de,ate){const D={},first=c.comboios[0]&&c.comboios[0].id===cb,r1=v=>Math.round(v*10)/10;
  for(let m=de.slice(0,7);m<=ate.slice(0,7);m=mesSeg(m)){let d={};try{const x=await S.db.doc('comb/'+m).get();d=x.exists?x.data():{}}catch(e){}
    const put=(dk,k,v)=>{const dt=m+'-'+dk;if(dt<de||dt>ate)return;D[dt]=D[dt]||{e:0,s:0};D[dt][k]=r1(D[dt][k]+(Number(v)||0))};
    Object.entries(((d.cbEnt||{})[cb])||{}).forEach(([dk,v])=>put(dk,'e',v));Object.entries(cbxSaiDia(d,cb,first)).forEach(([dk,v])=>put(dk,'s',v))}
  return D}
/* saldo dia a dia depois do ultimo fechamento, com ajustes {data:+L entrada/-L saida}.
   min = menor saldo de 'from' em diante (saida so pode usar o que nao vai faltar depois); neg = dias que ficam negativos.
   null = sem saldo informado (regra: entrada = saida, nao trava) */
async function cbxRun(c,cb,from,aj){const F=cbxFechUlt(cb);if(!F||from<=F.corte)return null;aj=aj||{};const de=addDia(F.corte,1);
  const ate=[today(),from,...Object.keys(aj)].sort().pop(),D=await cbxDias(c,cb,de,ate);let run=Number(F.saldo),min=null;const neg=[];
  for(let d=de;d<=ate;d=addDia(d,1)){const x=D[d]||{e:0,s:0};run=Math.round((run+x.e-x.s+(Number(aj[d])||0))*10)/10;if(d>=from){if(min==null||run<min)min=run;if(run<0)neg.push(d)}}
  return {min,neg,D}}
const cbxSemSaldo=(r,L)=>`<b>Sem saldo no comboio.</b> ${L!=null?`Saida de ${nf(L,1)} L, `:''}faltam ${nf(-r.min,1)} L. Lance antes a entrada de diesel.`;
/* entradas do mes para o relatorio: enquanto o comboio nao tem saldo informado (ate o 1o fechamento), entrada = saida */
function cbxEntMes(c,d,m){let ent=0,est=false;const all=S.cbxFech||{};
  c.comboios.forEach((k,i)=>{const F0=(all[k.id]||[])[0],sai=cbxSaiDia(d,k.id,i===0),en=((d.cbEnt||{})[k.id])||{};
    new Set([...Object.keys(sai),...Object.keys(en)]).forEach(dk=>{const dt=m+'-'+dk;if(!F0||dt<=F0.corte){ent+=Number(sai[dk])||0;if(Number(sai[dk]))est=true}else ent+=Number(en[dk])||0})});
  /* entradas de comboio que nao esta mais cadastrado */
  Object.entries(d.cbEnt||{}).forEach(([k,o])=>{if(!c.comboios.some(z=>z.id===k))Object.values(o).forEach(v=>ent+=Number(v)||0)});
  return {ent:Math.round(ent*10)/10,est}}

async function abDupCarga(dt){const m=mesKey(dt),[y,mo]=m.split('-').map(Number),pm=mo===1?`${y-1}-12`:`${y}-${String(mo-1).padStart(2,'0')}`,ms=[pm,m,mesSeg(m)].filter(k=>k<=mesKey());

    const dsp=()=>{const dt=st.dt;cbxRun(c,cb.id,dt,{}).then(r=>{if(dt!==st.dt)return;disp=r;dispDt=dt;tot()}).catch(()=>{})};

      const v=sh.querySelector('[data-pv]');if(v)v.onclick=()=>{st.dt=v.dataset.pv;sh.querySelector('#cbx-dt').value=st.dt;all()}};

    const upd=(id,k,v)=>{const d=dr();d[id]={...(d[id]||{}),[k]:v};save(d)};

      rows.querySelectorAll('.cbx-r').forEach(el=>{bindRow(el);const id=el.dataset.r;

      sh.querySelector('#cbx-flt').innerHTML=flt();bindF();mAll();tot();pd();if(dispDt!==st.dt){disp=null;dsp()}if(dupDt!==st.dt)dupC()};

    rows.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;const ins=[...rows.querySelectorAll('input')],i=ins.indexOf(ev.target);if(i<0)return;ev.preventDefault();const n=ins[i+1];if(n){n.focus();n.select&&n.select()}else ev.target.blur()});
    const bindF=()=>{sh.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{st.f=b.dataset.f;st.sf='';all()});sh.querySelectorAll('[data-sf]').forEach(b=>b.onclick=()=>{st.sf=st.sf===b.dataset.sf?'':b.dataset.sf;all()})};
    let qT;sh.querySelector('#cbx-q').addEventListener('input',ev=>{clearTimeout(qT);qT=setTimeout(()=>{st.q=ev.target.value.trim();all()},200)});
    /* trocar a data com linhas preenchidas: lancar agora ou guardar nesta data */
    const dI=sh.querySelector('#cbx-dt');dI.addEventListener('change',()=>{const nv=dI.value;if(!nv||nv===st.dt)return;mLoad();const n=Object.values(dr()).filter(x=>Number(x.l)>0).length+M.filter(x=>Number(x.l)>0).length;
      if(!n){st.dt=nv;all();return}const old=st.dt;dI.value=old;const box=sh.querySelector('#cbx-ask');

    go.onclick=async()=>{const d=dr(),ok=[],okM=[];base().forEach(e=>{const x=d[e.id];if(x&&Number(x.l)>0){const o=chk(e,x);if(o.ok)ok.push({e,x,o})}});

            await S.db.doc('equipamentos/'+e.id).update(up);Object.assign(e,up)}
          const cc=calcAbast(e,st.dt,Number(r.x.h),Number(r.x.l),true);if(cc.erro){f++;continue}
          if(cc.retro){const rr=await abastOp(e,{tipo:'add',x:{data:st.dt,h0:Number(r.x.h),litros:Number(r.x.l),cheio:true,custo:r.o.cu,cb:cb.id}});if(rr.erro){f++;fe.push(`${esc(e.codigo)}: ${esc(rr.erro)}.`);continue}}
          else await abastGravar(e,{...cc,custo:r.o.cu,cb:cb.id});n++;const dd=dr();delete dd[e.id];save(dd)}catch(er){console.error(er);f++}}

/* ---------- Importar planilha (xlsx ou csv) para o rascunho do lote ---------- */
function cbxImport(){const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls,.csv,text/csv';
  inp.onchange=async()=>{const fl=inp.files&&inp.files[0];if(!fl)return;toast('Lendo a planilha…');
    try{let aoa;if(/\.csv$/i.test(fl.name)||fl.type==='text/csv'){const t=await fl.text(),sep=(t.split('\n')[0].match(/;/g)||[]).length>=(t.split('\n')[0].match(/,/g)||[]).length?';':',';aoa=t.split(/\r?\n/).map(l=>l.split(sep).map(v=>v.replace(/^"|"$/g,'').trim()))}
      else{if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('xlsx'));document.head.appendChild(s)});
        const wb=XLSX.read(await fl.arrayBuffer(),{type:'array',cellDates:false});aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})}
      const r=await cbxImportAoa(aoa);if(!r)return;
      toast(`${r.n} abastecimento${r.n===1?'':'s'} na tela para conferir${r.fora.length?` · ${r.fora.length} TAG nao encontrada${r.fora.length===1?'':'s'}: ${r.fora.slice(0,4).join(', ')}`:''}`);
      cbxLote.st&&(cbxLote.st.q='',cbxLote.st.f='todos');NAV.pop();cbxLote(r.dt)}
    catch(e){console.error(e);toast(e&&e.message==='xlsx'?'Para ler .xlsx precisa de internet na primeira vez. Ou salve como .csv.':'Nao foi possivel ler a planilha.')}};
  inp.click()}
async function cbxImportAoa(aoa){const c=await cbxCfg(),cb=cbxCur(c);const N=v=>nzCod(String(v||''));
  const hi=aoa.findIndex(r=>r.some(v=>/^(tag|equip|equipamento|codigo|frota|prefixo)$/.test(N(v)))&&r.some(v=>/litro|^lts?$|quantidade|^qtd/.test(N(v))));
  if(hi<0){toast('Nao achei os titulos das colunas (TAG e Litros).');return null}
  const H=aoa[hi].map(N),col=re=>H.findIndex(h=>re.test(h));
  const ci={eq:col(/^(tag|equip|equipamento|codigo|frota|prefixo)$/),dt:col(/^(data|dia)$/),h:col(/horimetro|^hm$|^horas?$|^km$|odometro/),l:col(/litro|^lts?$|quantidade|^qtd/),c:col(/custo|centro/)};

/* MSE: TAG em texto livre pode repetir ou faltar. Separa os equipamentos pela TAG e pela sequencia do horimetro, do km e da placa:
   leitura que volta ou que avanca demais para os dias passados vira outro equipamento */
function mseEquips(l){const G=[],num=v=>v===''||v==null||!isFinite(Number(v))?null:Number(v),dias=(a,b)=>Math.max(0,Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5));
  l.slice().sort((a,b)=>(a.data||'').localeCompare(b.data||'')||(a.ts||0)-(b.ts||0)).forEach(x=>{const t=nzCod(x.tag||''),h=num(x.horimetro),km=num(x.km),pl=nzCod(x.placa||'');let best=null,bs=Infinity;
    for(const g of G){if(g.t!==t)continue;const dd=dias(g.ud,x.data||g.ud)+1;let s=0,cmp=false,ok=true;
      if(pl&&g.pl){cmp=true;if(pl!==g.pl)ok=false}
      if(ok&&h!=null&&g.h!=null){cmp=true;const d=h-g.h;if(d<0||d>24*dd)ok=false;else s+=d}
      if(ok&&km!=null&&g.km!=null){cmp=true;const d=km-g.km;if(d<0||d>1500*dd)ok=false;else s+=d/50}
      if(!cmp&&t)cmp=true;if(ok&&cmp&&s<bs){best=g;bs=s}}
    if(!best)G.push(best={t,tag:'',l:[],h:null,km:null,pl:'',placa:'',dono:'',lt:0});
    best.l.push(x);best.ud=x.data||best.ud;best.lt=Math.round((best.lt+(Number(x.litros)||0))*10)/10;
    if(h!=null)best.h=h;if(km!=null)best.km=km;if(pl){best.pl=pl;best.placa=x.placa}if(x.tag)best.tag=String(x.tag).toUpperCase();if(x.dono)best.dono=x.dono});
  G.sort((a,b)=>(a.t?0:1)-(b.t?0:1)||a.tag.localeCompare(b.tag,'pt',{numeric:true}));
  const cnt={};G.forEach(g=>cnt[g.t]=(cnt[g.t]||0)+1);const seq={};
  G.forEach(g=>{const n=cnt[g.t]>1?` (${seq[g.t]=(seq[g.t]||0)+1})`:'';g.nome=(g.tag||'Sem TAG')+n;
    g.sub=[g.placa,g.dono,g.h!=null?nf(g.h,1)+' h':'',g.km!=null?nf(g.km,0)+' km':''].filter(Boolean).slice(0,2).join(' · ')});
  return G}
